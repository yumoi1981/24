<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>公民トロッコアドベンチャー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: TVクイズのボーナスステージ。緊張感と派手さ、でも問題文は読みやすく
   IDEA: 洞窟のレールを走るトロッコ。分岐点が近づく＝制限時間
   PICTURE: canvasで描く遠近法の洞窟・たいまつ・分岐レール・5人乗りトロッコ
   COLOUR and TYPE: 岩の焦げ茶と闇、たいまつの橙、金の財宝。見出しDela Gothic One、本文M PLUS 1p
   LAYOUT: 全画面の洞窟の上に、上部に問題カード、左右に木の看板の選択肢、下にトロッコ */
:root{color-scheme:dark;--gold:#ffcd3c;--gold2:#ff9a1f;--wood:#6b3f1d;--wood2:#8d5629;--ink:#fff7e6;--lava:#ff4a12}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0604;color:var(--ink);overflow:hidden;font:16px/1.5 "M PLUS 1p","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.logo{font-family:"Dela Gothic One",sans-serif;text-align:center;line-height:1.05;margin:18px 0 4px}
.logo small{display:block;font-size:15px;color:#ffe9b0;letter-spacing:.1em;margin-bottom:6px}
.logo b{display:block;font-weight:400;font-size:clamp(34px,10vw,52px);background:linear-gradient(#fff3b0,#ffcd3c 45%,#e07a10);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4a1e05) drop-shadow(0 0 14px rgba(255,140,20,.45))}
.lead{text-align:center;font-size:14px;color:#f3d9b0;margin:6px 16px 10px}
#list{flex:1;overflow-y:auto;padding:4px 14px 24px;-webkit-overflow-scrolling:touch}
.grp{font-size:13px;color:#ffcd3c;margin:14px 4px 6px;font-weight:800}
.course{display:flex;width:100%;gap:12px;align-items:center;text-align:left;padding:12px 14px;margin-bottom:8px;border:0;border-radius:14px;background:linear-gradient(#3a2414,#26170c);box-shadow:inset 0 1px 0 rgba(255,220,160,.25),0 4px 0 #120904;min-height:60px}
.course:active{transform:translateY(2px)}
.course .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:"Dela Gothic One";background:radial-gradient(circle at 35% 30%,#ffe58a,#d98a10);color:#3b1a03;font-size:17px}
.course .t{flex:1}
.course .t b{display:block;font-size:16px}
.course .t span{font-size:12px;color:#d9b98a}
.meter{height:6px;border-radius:3px;background:#120a05;margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#ffcd3c,#ff8a1f)}
.course .clr{flex:none;font-size:12px;color:#ffcd3c;font-weight:800}
.foot{font-size:12px;color:#b8996e;text-align:center;margin:10px 0 0}
.reset{display:block;margin:10px auto 0;background:none;border:1px solid #6b4a2a;border-radius:10px;color:#c9a679;font-size:13px;padding:8px 14px;min-height:40px}
/* game */
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.hud .x{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);font-size:18px}
#ctitle{flex:1;font-size:13px;color:#ffe2a8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lamps{display:flex;gap:5px}
#lamps i{width:16px;height:16px;border-radius:50%;background:#2a1a0e;border:2px solid #6b4a2a}
#lamps i.ok{background:radial-gradient(circle at 35% 35%,#fff3b0,#ffb020);border-color:#ffcd3c;box-shadow:0 0 8px #ffb020}
#lamps i.now{border-color:#fff}
#qcard{margin:10px 12px 0;padding:12px 14px 12px;border-radius:16px;background:rgba(12,7,3,.82);border:2px solid #8a5a2c;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#qno{font-family:"Dela Gothic One";color:var(--gold);font-size:15px}
#qtext{font-size:clamp(17px,4.8vw,21px);font-weight:800;line-height:1.45;margin-top:2px;text-wrap:pretty}
.timer{height:8px;border-radius:4px;background:#2a1a0e;margin-top:10px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4a12,#ffcd3c);transform-origin:left}
#choices{position:absolute;left:0;right:0;bottom:calc(27vh + env(safe-area-inset-bottom));display:flex;gap:10px;padding:0 10px}
.ch{flex:1;border:0;padding:14px 10px 16px;border-radius:12px;background:linear-gradient(#a7672f,#7a4720);box-shadow:inset 0 2px 0 rgba(255,220,170,.45),inset 0 -4px 0 rgba(0,0,0,.3),0 6px 0 #2d1606,0 10px 20px rgba(0,0,0,.5);font-weight:800;font-size:clamp(15px,4.3vw,18px);line-height:1.35;min-height:88px;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 1px 0 #3a1a05}
.ch .arw{font-family:"Dela Gothic One";font-size:13px;color:#ffe28a}
.ch:active{transform:translateY(3px)}
.ch:disabled{opacity:.55}
.ch.pick{outline:3px solid #fff;opacity:1}
.ch.right{background:linear-gradient(#ffd75a,#e59a12);color:#3a1a03;text-shadow:none;opacity:1}
.ch.wrong{background:linear-gradient(#6a2a20,#3e140c);opacity:1}
#fx{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:"Dela Gothic One";font-size:clamp(40px,14vw,72px);pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s}
#fx.on{opacity:1;transform:scale(1)}
#expl{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:14px 16px;border-radius:16px;background:rgba(18,10,4,.94);border:2px solid var(--gold);display:none}
#expl.on{display:flex;flex-direction:column}
#exB{overflow-y:auto;max-height:58vh;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.lr{margin-bottom:10px}
.lr .lh{font-weight:800;font-size:16px;line-height:1.7}
.lr.ok .lh{color:var(--gold)}.lr.ng .lh{color:#ff8a6a}
.lr p{margin:2px 0 0;font-size:15px;line-height:1.75;color:#f3e3c8}
.gl{border-top:1px dashed #8a5a2c;padding-top:8px;margin-top:4px}
.glh{font-size:13px;font-weight:800;color:#ffcd3c;margin-bottom:6px}
.gc{background:#2e1b0d;border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:4px solid #ffcd3c}
.gc b{font-size:15px;color:#fff3d6;line-height:1.7}
.gc p{margin:4px 0 0;font-size:14px;line-height:1.8;color:#ecd9bb}
#expl b{color:var(--gold);font-size:17px}
#expl p{margin:4px 0 10px;font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:17px;min-height:48px;background:linear-gradient(#ffe07a,#f0a01a);color:#3a1a03;box-shadow:0 4px 0 #7a4a08}
.btn.sub{background:#3a2414;color:#ffe2a8;box-shadow:0 4px 0 #120904;margin-top:10px}
/* result */
#result{justify-content:center;padding-left:16px;padding-right:16px}
.rbox{max-width:520px;width:100%;margin:0 auto;max-height:92vh;overflow-y:auto;padding:18px;border-radius:18px;background:rgba(14,8,3,.9);border:2px solid #8a5a2c}
.rbox h2{font-family:"Dela Gothic One";font-weight:400;text-align:center;font-size:clamp(34px,11vw,48px);margin:4px 0 6px;line-height:1.05}
.rbox h2.win{color:var(--gold);text-shadow:0 0 18px rgba(255,180,40,.6)}
.rbox h2.lose{color:#ff6a3a}
.rbox .sub2{text-align:center;color:#f3d9b0;margin:0 0 12px;font-size:14px}
.miss{border-radius:12px;background:#2a160a;padding:12px 14px;margin-bottom:12px}
.miss .q{font-weight:800}
.miss .a{margin-top:6px;color:var(--gold);font-weight:800}
.miss .e{margin-top:4px;font-size:14px;color:#f0dcc0}
.rev{list-style:none;padding:0;margin:0 0 14px}
.rev li{font-size:14px;padding:8px 0;border-bottom:1px solid #3a2414}
.rev li b{color:var(--gold)}
rt{font-size:.5em;font-weight:700;letter-spacing:0;color:inherit;opacity:.9}
ruby{ruby-position:over}
#qtext,.ch .tx,#exP,#exT,.miss,.rev li{line-height:1.75}
.miss .wa{color:#ff8a6a;margin-top:12px}
.miss .e{padding-left:1.4em}
.set{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:0 14px 4px}
.set span{font-size:13px;color:#ffe2a8;font-weight:800;margin-right:4px}
.set button{border:1px solid #8a5a2c;background:#26170c;border-radius:999px;padding:6px 12px;min-height:40px;font-size:14px;font-weight:700}
.set button.on{background:linear-gradient(#ffe07a,#f0a01a);color:#3a1a03;border-color:#ffcd3c}
.glbtn{display:block;margin:6px auto 2px;border:0;border-radius:12px;padding:10px 22px;min-height:44px;font-weight:800;font-size:15px;background:#3a2414;color:#ffe2a8;box-shadow:inset 0 1px 0 rgba(255,220,160,.25),0 3px 0 #120904}
#glTitle{flex:1;font-family:"Dela Gothic One";font-size:20px;color:var(--gold)}
.glbar{padding:10px 12px 4px}
#glq{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:2px solid #8a5a2c;background:#1a0f07;color:var(--ink)}
.glchips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 8px;flex:none;-webkit-overflow-scrolling:touch}
.glchips button{flex:none;border:1px solid #8a5a2c;background:#26170c;border-radius:999px;padding:6px 12px;min-height:38px;font-size:13px;font-weight:700;white-space:nowrap}
.glchips button.on{background:linear-gradient(#ffe07a,#f0a01a);color:#3a1a03;border-color:#ffcd3c}
#gllist{flex:1;overflow-y:auto;padding:0 12px 28px;-webkit-overflow-scrolling:touch;background:rgba(10,6,3,.55)}
.glsec{font-size:13px;font-weight:800;color:#ffcd3c;margin:14px 2px 6px}
.glcount{font-size:12px;color:#c9a679;margin:8px 2px 0}
#gllist .gc{background:rgba(46,27,13,.95)}
.gc .tag{display:block;font-size:11px;color:#c9a679;margin-top:6px}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#fx{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title" class="screen on">
  <h1 class="logo"><small>中3公民 第2章　日本国憲法</small><b>トロッコ<br>アドベンチャー</b></h1>
  <p class="lead">2択を5問連続で正解すればクリア。1問でもまちがえたら奈落の底へ！</p>
  <div class="set" id="tset"><span>制限時間</span></div>
  <button class="glbtn" id="openGl">用語集で勉強する</button>
  <div id="list"></div>
</div>

<div id="game" class="screen">
  <div class="hud"><button class="x" id="quit" aria-label="コース選択にもどる">✕</button><div id="ctitle"></div><div id="lamps"></div></div>
  <div id="qcard"><div id="qno"></div><div id="qtext"></div><div class="timer"><i id="tbar"></i></div></div>
  <div id="choices">
    <button class="ch" id="chL"><span class="arw">◀ 左</span><span class="tx"></span></button>
    <button class="ch" id="chR"><span class="arw">右 ▶</span><span class="tx"></span></button>
  </div>
  <div id="fx"></div>
  <div id="expl"><div id="exB"></div><button class="btn" id="next">つぎへ進む</button></div>
</div>

<div id="gloss" class="screen">
  <div class="hud"><button class="x" id="closeGl" aria-label="もどる">✕</button><div id="glTitle">用語集</div></div>
  <div class="glbar"><input id="glq" type="search" placeholder="用語をさがす（例：非核三原則）" autocomplete="off"></div>
  <div class="glchips" id="glchips"></div>
  <div id="gllist"></div>
</div>

<div id="result" class="screen"><div class="rbox" id="rbox"></div></div>

<script>
{
/* ============ 問題データ [問題, 正解, まちがい, 解説] ============ */
const COURSES=[
{id:"c1",g:"教科書 p.44〜49",t:"立憲主義と法の支配",s:"教科書 p.44",q:[
["国の基本を定めた法を何という？","憲法","法律","憲法は国の基本を定めた法。国民の権利と、それを実現するための政治のしくみが定められている。","法律は、憲法の下で国会が制定するきまり。憲法に反する法律はつくれない。"],
["憲法によって国家権力を制限し、国民の人権を保障しようとすることを何という？","立憲主義","民主主義","立憲主義＝憲法で国家権力をしばり、国民の人権を守る考え方。","民主主義は、国民が政治の主役となって物事を決めるしくみ・考え方。権力を憲法でしばる考え方は立憲主義という。"],
["政治が法に基づいて行われなければならないことを何という？","法の支配","人の支配","法の支配では、議会（国民の代表）が制定した法が政府を制御し、政府はその法に従って政治を行う。","人の支配は、君主や独裁者などの権力者が法にしばられず、思うままに権力を使う政治。"],
["君主・独裁者（権力者）が、国民に直接政治権力を行使するのは？","人の支配","法の支配","人の支配では、権力者の思うままに政治権力が使われる。","法の支配は、国民の代表が定めた法で政府を制御するしくみ。権力者も法に従う。"],
["「法の支配」で、法を制定するのはだれ？","議会（国民の代表）","君主・独裁者","法の支配では、議会（国民の代表）が法を制定し、その法が政府を制御する。","君主・独裁者が自由に権力を使うのは「人の支配」。"],
["立憲主義を実現するため、憲法は国の何として位置づけられている？","最高法規","一般法","憲法は国の最高法規。すべての法は憲法を頂点に位置づけられている。","一般法は、特定の分野に限らず広く適用される法律のこと（特別法の反対の言葉）。憲法の位置づけを表す言葉ではない。"],
["最高法規である憲法に反する法はどうなる？","無効になる","有効のまま","最高法規である憲法に反する法は無効になる。","憲法に反する法が有効のままだと、憲法で権力をしばる立憲主義が成り立たない。"],
["国会が憲法に反する法律をつくったとき、その法律を無効にできるのは？","裁判所","内閣","裁判所は違憲審査権をもち、憲法に反する法律を無効にできる。","内閣は法律に従って政策を実行する行政機関。法律を無効にする権限はない。"],
["法の構成で、憲法の下にあり、国会が制定するものは？","法律","命令","法の構成：憲法 → 法律（国会が制定）→ 命令・規則。","命令は、内閣や省庁が制定する政令や省令など。法律より下に位置づけられる。"],
["政令や省令などの「命令」を制定するのは？","内閣や省庁","国会","政令は内閣、省令は各省が制定する。これらを「命令」という。","国会が制定するのは法律。国会は国の唯一の立法機関。"],
["最高裁判所など、国会以外の国の機関が制定するものを何という？","規則","命令","規則は、国会以外の国の機関（最高裁判所など）が制定する。","命令は、内閣や省庁が制定する政令や省令など。"],
["権力を国会・内閣・裁判所に分け、互いに抑制し合う考え方は？","権力分立","国民主権","権力分立で、一つの機関が暴走して国民の権利を侵害することを防ぐ。政治のしくみの基本にある考え方。","国民主権は、国の政治のあり方を最終的に決める力（主権）が国民にあるという原理。"],
["国家が強大な権力をもっている理由として、教科書が挙げているのは？","国民の自由や安全を守るため","他国を支配するため","国家は国民の自由や安全を守るために強大な権力をもつ。ただし、あやまって使うと国民の生命や自由を奪いかねないので、憲法で制限する。","他国を支配するため、という理由は教科書に書かれていない。"],
["「ナチズムを繰り返さない」をめざした1949年の憲法は？","ドイツ連邦共和国基本法","イタリア共和国憲法","ドイツ連邦共和国基本法（1949年）はドイツの憲法にあたる。","イタリア共和国憲法（1948年）は「国民が主体の国へ」をめざした。"],
["「国民が主体の国へ」をめざした1948年の憲法は？","イタリア共和国憲法","大韓民国憲法","イタリア共和国憲法（1948年）は、第二次世界大戦後に成立した新しい憲法の一つ。","大韓民国憲法（1987年）は「軍政の廃止と民主化へ」をめざした。"],
["「軍政の廃止と民主化へ」をめざした1987年の憲法は？","大韓民国憲法","南アフリカ共和国憲法","大韓民国憲法（1987年）：軍政の廃止と民主化へ。","南アフリカ共和国憲法（1996年）は「アパルトヘイトの廃止へ」をめざした。"],
["「アパルトヘイトの廃止へ」をめざした1996年の憲法は？","南アフリカ共和国憲法","ドイツ連邦共和国基本法","南アフリカ共和国憲法（1996年）：アパルトヘイト（人種隔離政策）の廃止へ。","ドイツ連邦共和国基本法（1949年）は「ナチズムを繰り返さない」をめざした。"],
["日本国憲法（1946年）がめざしたのは？","戦争をしない自由で民主的な国へ","軍政の廃止と民主化へ","日本国憲法（1946年公布）：戦争をしない自由で民主的な国へ。","「軍政の廃止と民主化へ」は大韓民国憲法（1987年）。"]
]},
{id:"c2",g:"教科書 p.44〜49",t:"日本国憲法の誕生",s:"教科書 p.44〜45・資料集 p.34",q:[
["1945年、日本が受け入れて降伏した宣言は？","ポツダム宣言","カイロ宣言","1945年、日本はポツダム宣言を受け入れて降伏し、第二次世界大戦が終わった（資料集では8月14日に受諾）。","カイロ宣言（1943年）は、アメリカ・イギリス・中国が対日戦の方針や日本の領土の扱いを示した宣言。降伏のときに受け入れたものではない。"],
["ポツダム宣言に示されていた日本の方針は？","軍国主義を取り除き、民主主義を復活・強化","天皇の統治権を強める","ポツダム宣言には、軍国主義の除去、民主主義の復活・強化、基本的人権の尊重などが示されていた。","天皇の統治権を強めるのは逆。ポツダム宣言は日本の民主化を求めた。"],
["1945年10月、日本政府に憲法改正を指示したのは？","マッカーサー（連合国軍最高司令官）","吉田茂首相","連合国軍最高司令官マッカーサーが、1945年10月11日に日本政府へ憲法改正を指示した。","吉田茂は日本国憲法公布時の首相。1946年の「自衛のための戦争も放棄」という見解などで知られる。"],
["政府がGHQに提出した、天皇の統治権を認める憲法案を何という？","松本案","GHQ草案","松本案（憲法改正要綱）は天皇の統治権を認める政府案で、1946年2月8日にGHQへ提出された。","GHQ草案は、松本案を拒否したGHQがマッカーサー三原則に基づいて自らつくった案。"],
["GHQが政府の草案を拒否した理由は？","大日本帝国憲法とあまり変わらず、十分に自由で民主的でない","天皇の権限を弱めすぎている","GHQは政府の草案が大日本帝国憲法とあまり変わらず、十分に自由で民主的ではないと考え、独自の案を示した。","実際は逆で、天皇の統治権を残していたことが問題とされた。"],
["GHQ草案のもとになった「マッカーサー三原則」に含まれるのは？","戦争を放棄する","軍隊を強化する","マッカーサー三原則：①天皇は国家元首の地位にある ②戦争を放棄する ③日本の封建制度を廃止する。","三原則は戦争の放棄を求めている。軍隊の強化は正反対。"],
["マッカーサー三原則に含まれるのは？","日本の封建制度を廃止する","議会を廃止する","三原則の③が「日本の封建制度を廃止する」。","議会の廃止は含まれない。GHQ草案でも国会は国権の最高機関とされた。"],
["マッカーサー三原則で、天皇はどうするとされた？","国家元首の地位にある","天皇制を廃止する","三原則の①は「天皇は国家元首の地位にある」。最終的に日本国憲法では「象徴」となった。","天皇制の廃止は三原則に含まれない。"],
["高野岩三郎らの憲法研究会がつくり、GHQ草案に影響を与えたのは？","憲法草案要綱","憲法改正要綱（松本案）","憲法研究会の「憲法草案要綱」をGHQは「民主主義的で賛成できる」と評価し、一部は新憲法に生かされた。","憲法改正要綱（松本案）は政府の案で、GHQに拒否された。"],
["GHQ草案に基づく憲法改正案を審議・修正・可決したのは？","帝国議会","国会","政府の憲法改正案は1946年6月に帝国議会に提出され、審議・修正を経て10月に可決された（枢密院も可決）。","国会は日本国憲法によってできた機関。当時はまだ大日本帝国憲法下の帝国議会だった。"],
["日本国憲法が公布されたのは？","1946年11月3日","1947年5月3日","公布＝国民に広く知らせること。1946年11月3日（今の文化の日）に公布された。","1947年5月3日は施行（実際に効力をもった）日。今の憲法記念日。"],
["日本国憲法が施行されたのは？","1947年5月3日","1946年11月3日","施行＝法が実際に効力をもつこと。1947年5月3日（今の憲法記念日）に施行された。","1946年11月3日は公布の日（今の文化の日）。"],
["日本国憲法は、どのような形でつくられた？","大日本帝国憲法の改正","まったく新しい憲法の制定","日本国憲法は、大日本帝国憲法の改正という形でつくられた（資料集：日本国憲法原本）。","形式上は改正の手続きを経ており、「まったく新しい憲法の制定」という形ではない。"],
["憲法制定に先がけて1946年4月10日に行われ、女性が初めて参加した選挙は？","衆議院議員選挙","参議院議員選挙","1946年4月10日の衆議院議員選挙で、女性が初めて選挙に参加した。","参議院は日本国憲法でできた議院。当時はまだなく、貴族院があった。"],
["1946年1月1日、天皇が自らを神とする考えを否定した「新日本建設に関する詔書」は何と呼ばれる？","人間宣言","終戦の詔書","天皇が自らを現御神（神）とする考えを否定したので「人間宣言」とよばれる。象徴天皇制導入への布石となった。","終戦の詔書は、1945年8月15日にラジオで戦争の終結を国民に伝えた詔書（玉音放送）。"],
["「新日本建設に関する詔書」の冒頭に盛り込まれたのは？","五箇条の御誓文","教育勅語","民主主義は戦後に輸入されたものではなく、明治天皇の五箇条の御誓文に原点があると示すため、昭和天皇の意向で盛り込まれた。","教育勅語は1890年に出された、教育の基本方針を示した明治天皇の言葉。"],
["GHQの民間要員として、憲法草案の人権条項の作成を担当した女性は？","ベアテ＝シロタ＝ゴードン","エレノア＝ルーズベルト","ベアテ＝シロタ＝ゴードン（1923〜2012年、アメリカ）は1945年12月に来日し、人権条項の作成を担当した。","エレノア＝ルーズベルトはアメリカ大統領夫人で、のちに世界人権宣言の作成に関わった人物。"],
["ベアテさんが日本国憲法に盛り込むことに大きな役割を果たしたのは？","「両性の本質的平等」や「社会保障」の条項","「戦争の放棄」の条項","戦前に10年間日本に住み、女性に権利がないことを知っていたベアテさんは、女性の権利を憲法に入れたいと考えた。","戦争の放棄は、マッカーサー三原則に基づく条項（第9条）。"],
["ベアテさんが来日したときの年齢は？","22歳","42歳","ベアテさんは22歳で来日し、憲法草案づくりに加わった。","42歳ではない。若い民間要員だった。"],
["大日本帝国憲法第3条「天皇ハ神聖ニシテ侵スヘカラス」。松本案では「神聖」が何に変わった？","至尊","象徴","松本案は「神聖」を「至尊（この上なく尊い）」に変えただけで、内容はほとんど変わらなかった。","「象徴」はGHQ草案・日本国憲法での天皇の位置づけ。"],
["GHQ草案で戦争の放棄は第8条。日本国憲法では第何条？","第9条","第8条","日本国憲法では第9条が、戦争の放棄・戦力の不保持・交戦権の否認を定める。","第8条はGHQ草案での番号。日本国憲法の第8条は皇室の財産のやりとりについての条文。"],
["「国会は、国権の最高機関であつて、国の唯一の立法機関である」は第何条？","第41条","第40条","第41条：国会は国権の最高機関で、国の唯一の立法機関。","第40条はGHQ草案での番号。"],
["日本国憲法の中で最も短い条文は？","第65条","第9条","第65条「行政権は、内閣に属する。」が最も短い条文。","第9条は戦争の放棄を定めた、2つの項からなる長めの条文。"]
]},
{id:"c3",g:"教科書 p.44〜49",t:"大日本帝国憲法と日本国憲法",s:"教科書 p.45・資料集 p.35",q:[
["大日本帝国憲法が施行されたのは？","1890年11月29日","1947年5月3日","大日本帝国憲法は1890年11月29日に施行された。","1947年5月3日は日本国憲法の施行日。"],
["君主（天皇）が定めた憲法を何という？","欽定憲法","民定憲法","欽定憲法＝君主が定めて国民に与える憲法。大日本帝国憲法がこれにあたる。","民定憲法は、国民が定める憲法。日本国憲法がこれにあたる。"],
["国民が定めた憲法を何という？","民定憲法","欽定憲法","民定憲法＝国民が定める憲法。日本国憲法がこれにあたる。","欽定憲法は、君主が定める憲法。大日本帝国憲法がこれにあたる。"],
["大日本帝国憲法の主権者は？","天皇","国民","大日本帝国憲法では主権は天皇にあった。","国民が主権者なのは日本国憲法（国民主権）。"],
["日本国憲法の主権者は？","国民","天皇","日本国憲法では主権は国民にある（国民主権）。","天皇が主権者だったのは大日本帝国憲法。"],
["大日本帝国憲法での天皇の地位は？","神聖な存在・国家の元首","日本国・日本国民統合の象徴","大日本帝国憲法では、天皇は神聖で侵してはならない存在、国家の元首とされた。","「象徴」は日本国憲法での天皇の地位（第1条）。"],
["日本国憲法での天皇の地位は？","日本国・日本国民統合の象徴","神聖で侵してはならない国家の元首","日本国憲法第1条：天皇は日本国の象徴であり日本国民統合の象徴。","神聖な国家の元首とされたのは大日本帝国憲法。"],
["大日本帝国憲法での国民の権利は？","法律によって制限できる臣民としての権利","永久に侵すことのできない基本的人権","臣民＝天皇に支配される民。権利は法律の範囲内でしか認められず、法律で制限できた。","永久に侵すことのできない基本的人権は、日本国憲法での保障。"],
["日本国憲法での国民の権利は？","永久に侵すことのできない基本的人権を尊重","法律の範囲内でのみ保障","日本国憲法は、自由権・平等権・社会権などの基本的人権を、永久に侵すことのできない権利として保障する。","法律の範囲内でのみ保障したのは大日本帝国憲法。"],
["大日本帝国憲法での国民の義務は？","兵役・納税","勤労・納税","大日本帝国憲法の国民の義務は兵役と納税。","勤労・納税は日本国憲法の義務（ほかに子どもに普通教育を受けさせる義務）。"],
["日本国憲法での国民の義務は？","普通教育を受けさせる・勤労・納税","兵役・勤労・納税","日本国憲法の三つの義務：子どもに普通教育を受けさせる義務・勤労の義務・納税の義務。","兵役の義務は大日本帝国憲法の義務。日本国憲法にはない。"],
["天皇が軍隊を指揮・命令する権限を何という？","統帥権","統治権","統帥権＝軍隊を指揮・命令する権限。大日本帝国憲法では天皇がもっていた。","統治権は、国を治める権限全体のこと。軍隊の指揮に限った言葉ではない。"],
["大日本帝国憲法下で国民に課されていた制度は？","徴兵制","戦力不保持","徴兵制＝国民に兵役（軍隊に入ること）を義務づける制度。","戦力不保持は日本国憲法第9条第2項の規定。"],
["日本国憲法の「戦争と軍隊」の規定は？","戦争放棄・戦力不保持・交戦権の否認","天皇が軍隊を指揮・命令","日本国憲法：戦争放棄・戦力不保持・交戦権の否認（平和主義）。","天皇が軍隊を指揮・命令するのは大日本帝国憲法の統帥権。"],
["大日本帝国憲法下の帝国議会は、天皇の何の機関？","協賛（同意）機関","最高機関","帝国議会は、天皇の立法に同意する協賛機関だった。","「国権の最高機関」は日本国憲法での国会の位置づけ。"],
["帝国議会を構成していたのは？","貴族院と衆議院","衆議院と参議院","帝国議会は貴族院（皇族・華族などの特権階級の代表）と衆議院の二院制。","衆議院と参議院は日本国憲法下の国会。"],
["日本国憲法での国会は？","国権の最高機関・唯一の立法機関","天皇の協賛機関","日本国憲法の国会は国権の最高機関・唯一の立法機関。衆議院・参議院は国民の代表機関。","天皇の協賛機関は大日本帝国憲法下の帝国議会。"],
["大日本帝国憲法での内閣は？","規定なし（国務大臣は天皇を輔弼する）","国権の最高機関","大日本帝国憲法には内閣の規定がなく、国務大臣は天皇を輔弼する（助ける）とされた。","国権の最高機関は日本国憲法の国会。"],
["日本国憲法での内閣は？","法律に従って政策を実現する機関（行政の執行機関）","天皇の政治を助ける機関","日本国憲法の内閣は、法律に従って政策を実現する機関（行政の執行機関）。","天皇の政治を助けるのは、大日本帝国憲法での国務大臣の役割。"],
["大日本帝国憲法下の裁判所は？","天皇の名において裁判を行う","司法権の独立を保障","大日本帝国憲法では、裁判は天皇の名において行われ、違憲審査権もなかった。","司法権の独立は日本国憲法で保障されたもの。"],
["日本国憲法で裁判所に認められているのは？","司法権の独立・違憲審査権","天皇の名において裁判を行う","日本国憲法は司法権の独立を保障し、裁判所は違憲審査権をもつ。","天皇の名において裁判を行ったのは大日本帝国憲法下の裁判所。"]
]},
{id:"c4",g:"教科書 p.44〜49",t:"三つの基本原理",s:"教科書 p.45・資料集 p.34〜35",q:[
["日本国憲法の三つの基本原理に入るのは？","基本的人権の尊重","権力分立","三つの基本原理＝国民主権・基本的人権の尊重・平和主義。","権力分立は、政治のしくみの基本にある考え方。三つの基本原理には入らない。"],
["三つの基本原理に入るのは？","平和主義","法の支配","平和主義は三つの基本原理の一つ。","法の支配は、政治は法に基づいて行うという考え方。三つの基本原理には入らない。"],
["三つの基本原理に入るのは？","国民主権","象徴天皇制","国民主権は三つの基本原理の一つ。","象徴天皇制は、国民主権のもとでの天皇の位置づけ。基本原理そのものではない。"],
["「政治の主体」「国民による政治」にあたる原理は？","国民主権","平和主義","国民主権＝政治の主体は国民（国民による政治）。","平和主義は「戦争の放棄」「国際協調」にあたる。"],
["「政治の目的」「国民のための政治」にあたる原理は？","基本的人権の尊重","国民主権","基本的人権の尊重＝政治の目的（国民のための政治）。","国民主権は「政治の主体」「国民による政治」。"],
["「戦争の放棄」「国際協調」にあたる原理は？","平和主義","基本的人権の尊重","平和主義＝戦争の放棄、国際協調。","基本的人権の尊重は「政治の目的」「国民のための政治」。"],
["憲法が制定された理由や理念、目的が示されているのは？","前文","第1条","前文には、憲法制定の理由や理念、目的が示されている。","第1条は天皇の地位と国民主権を定めた条文。"],
["前文で、憲法の制定者であると宣言されているのは？","日本国民","天皇","前文では、日本国民が憲法の制定者だと宣言している（民定憲法）。","天皇が制定者なのは大日本帝国憲法（欽定憲法）。"],
["前文で、決意が高らかに宣言されているのは？","恒久の平和主義","軍備の拡大","前文で、再び戦争を起こさないという恒久の平和主義の決意が宣言されている。","軍備の拡大は平和主義と正反対。"],
["日本国憲法は、1946年の公布以来何回改正された？","一度も改正されていない","2回","日本国憲法は1946年の公布以来、一度も改正されていない。","改正は一度もない。"],
["日本では改正できないとされているのは？","三つの基本原理","改正の手続き","国民主権・基本的人権の尊重・平和主義の原則は改正できないとされている。","改正の手続きは第96条に定められている条文で、改正の議論の対象になりうる。"],
["改正手続きが法律をつくる手続きより厳格な憲法を何という？","硬性憲法","軟性憲法","硬性憲法＝改正の手続きが法律をつくる手続きより厳しい憲法。日本国憲法は硬性憲法。","軟性憲法は、法律と同じ手続きで改正できる憲法。"],
["日本国憲法が改正されてこなかった理由は？","条文が簡素で法改正で対応でき、国民が支持してきた","改正すると国際法違反になる","条文が他国と比べて簡素で、他国で改憲が必要な項目も法改正で対応できたこと、国民が現行憲法を支持してきたことが理由。","改正すると国際法違反になる、ということはない。"],
["1947年に『あたらしい憲法のはなし』を発行したのは？","文部省（現在の文部科学省）","GHQ","1947年に文部省が発行した中学1年生用の教科書。憲法の精神や基本原理をやさしく解説した。","GHQは占領軍の総司令部。この教科書の発行元ではない。"],
["資料集の説明で、「基本的人権の尊重」とは？","人が当然もつ権利は、国家権力に奪われたり侵されたりしない","国家が必要に応じて権利を与える","基本的人権（自由権・平等権・社会権・参政権・請求権）は人間が当たり前にもつ権利で、国家権力に奪われたり侵されたりしない。","国家が権利を「与える」という考え方は、法律の範囲内でしか権利を認めなかった大日本帝国憲法に近い。"],
["資料集の説明で、「平和主義」とは？","軍隊や武器をもたず、国家間の争いは話し合いで解決","強い軍隊で戦争を防ぐ","平和主義：二度と戦争をしないため軍隊や武器といった武力をもたず、国家間の争いは話し合いで解決する。","強い軍隊で戦争を防ぐという考えは、資料集の平和主義の説明とは逆。"]
]},
{id:"c5",g:"教科書 p.44〜49",t:"国民主権",s:"教科書 p.46・資料集 p.36",q:[
["主権とは？","国の政治のあり方を最終的に決める力","法律をつくる力","主権＝国の政治のあり方を最終的に決める力。","法律をつくる力は立法権。国会がもつ。"],
["「国民主権」の「主権」はどの意味？","国の政治のあり方を最終的に決定する権利","他国に干渉されない国家の独立性","主権の意味：①国家の独立性 ②領土・国民に対する統治権 ③国の政治のあり方を最終的に決定する権利。国民主権の主権は③。","国家の独立性も主権の意味の一つ（①）だが、国民主権の「主権」はこの意味ではない。"],
["選挙で代表者（国会議員）を選び、代表者が政治を行うしくみは？","間接民主制","直接民主制","間接民主制＝選挙で代表者を選び、代表者が議会で議論し決める。","直接民主制は、国民が直接政治に参加して決めるしくみ。"],
["国民が直接、意思を表明して政治に参加するしくみは？","直接民主制","間接民主制","直接民主制：憲法改正の国民投票、最高裁判所裁判官の国民審査、地方自治特別法の住民投票、地方自治の直接請求権など。","間接民主制は、選挙で選んだ代表者に政治を任せるしくみ。"],
["憲法改正のときに行われるのは？","国民投票","国民審査","憲法改正には国民投票で過半数の賛成が必要（第96条）。","国民審査は、最高裁判所の裁判官がふさわしいかを国民が審査する制度（第79条）。"],
["最高裁判所の裁判官に対して行われるのは？","国民審査","国民投票","最高裁判所の裁判官は国民審査を受ける（第79条）。","国民投票は憲法改正のときに行われる（第96条）。"],
["地方自治特別法について行われるのは？","住民投票","国民審査","一つの地方公共団体だけに適用される特別法には、その住民の住民投票が必要（第95条）。","国民審査は最高裁判所の裁判官に対して行うもの。"],
["国民審査を定めた条文は？","第79条","第96条","国民審査は第79条。","第96条は憲法改正の手続き（国民投票）。"],
["選挙について定めた条文は？","第15条・43条・44条","第93条・95条","選挙は第15条・43条・44条。","第93条・95条は地方自治（住民投票など）に関する条文。"],
["地方自治で取り入れられている直接民主制のしくみは？","直接請求権","国民審査","地方自治では、住民が条例の制定や首長の解職などを求める直接請求権が認められている。","国民審査は、国の最高裁判所裁判官に対する制度。"],
["国民が裁判に参加する制度は？","裁判員制度","国民審査","裁判員制度は、国民が裁判員として裁判に参加する制度。","国民審査は裁判に参加する制度ではなく、最高裁判所裁判官を審査する制度。"],
["国会議員は国会で、だれの代表として議論する？","すべての国民","自分の選挙区の住民だけ","国会議員は、すべての国民の代表として国の政治のあり方を議論し、決定する。","選挙区から選ばれても、その選挙区の住民だけの代表ではない。"],
["国民主権の実現に大切なこととして、教科書が挙げているのは？","選挙自体が公正に行われること","投票先を政府が決めること","国民が情報を入手し、自由に話し合い、自分の意思で投票すること、選挙自体が公正に行われることが大切。","政府が投票先を決めるのは国民主権に反する。"],
["国民にとって重要なことや、国民の権利に重大な影響を及ぼすことを最終的に決めるのは？","国民自身","内閣","国民主権とは、重要なことは国民自身が最終的に決めるということ。","内閣は行政を担う機関。最終的に決めるのは主権者である国民。"],
["第1条で、天皇の地位は何に基づく？","主権の存する日本国民の総意","皇室典範","第1条：天皇の地位は、主権の存する日本国民の総意に基づく。","皇室典範は皇位の継承などを定めた法律。天皇の地位の根拠ではない。"],
["前文「国政は国民の厳粛な信託によるもの」。その権力はだれが行使する？","国民の代表者","天皇","前文：国政の権威は国民に由来し、権力は国民の代表者が行使し、福利は国民が享受する。","天皇は国政に関する権能をもたない。"],
["間接民主制が正しく機能するために国民に必要なのは？","主権者として責任をもち、情報を集めて代表を選ぶ","政治を代表者に任せきりにする","国民が主権者であることに責任をもち、新聞やテレビなどのマスメディアを通じて情報収集し、代表者を選ぶ必要がある。","任せきりにすると、代表者が国民の意見を反映しなくなるおそれがある。"]
]},
{id:"c6",g:"教科書 p.44〜49",t:"象徴天皇制",s:"教科書 p.47・資料集 p.36〜37",q:[
["日本国憲法で、天皇は何とされている？","日本国と日本国民統合の象徴","国家の元首","第1条：天皇は日本国の象徴であり日本国民統合の象徴。","国家の元首とされたのは大日本帝国憲法の天皇。"],
["天皇を日本国と日本国民統合の象徴とする制度を何という？","象徴天皇制","立憲君主制","天皇を象徴とする制度を象徴天皇制という。","立憲君主制は、君主の権力を憲法で制限する政治体制（例：イギリス、大日本帝国憲法下の日本）。"],
["天皇が行うのは？","形式的・儀礼的な国事行為のみ","国の政治に関する行為","天皇は国の政治に関する行為を一切行わず、形式的・儀礼的な国事行為のみを行う。","第4条で、天皇は国政に関する権能を有しないとされている。"],
["すべての国事行為に必要なのは？","内閣の助言と承認","国会の承認","すべての国事行為には内閣の助言と承認が必要（第3条）。","国会の承認は、条約の承認などで必要になるもの。国事行為に必要なのは内閣の助言と承認。"],
["国事行為の責任を負うのは？","内閣","天皇","国事行為の責任は内閣が負う（第3条）。","天皇には政治的な権限がないので、責任も負わない。"],
["「天皇は国政に関する権能を有しない」と定めた条文は？","第4条","第3条","第4条：天皇は憲法の定める国事に関する行為のみを行い、国政に関する権能を有しない。","第3条は、国事行為には内閣の助言と承認が必要で、内閣が責任を負うという条文。"],
["内閣総理大臣を任命するのは天皇。指名するのは？","国会","内閣","内閣総理大臣は国会が指名し、天皇が任命する（第6条）。","内閣が指名するのは最高裁判所長官。"],
["最高裁判所長官を任命するのは天皇。指名するのは？","内閣","国会","最高裁判所長官は内閣が指名し、天皇が任命する（第6条）。","国会が指名するのは内閣総理大臣。"],
["天皇の国事行為はどちら？","衆議院の解散","法律の議決","衆議院の解散は国事行為（第7条）。実際に決めるのは内閣。","法律の議決は国会の仕事。"],
["天皇の国事行為はどちら？","国会の召集","予算の作成","国会の召集は国事行為（第7条）。","予算の作成は内閣の仕事。"],
["天皇の国事行為はどちら？","栄典（勲章など）の授与","条約の締結","勲章などの栄典の授与は国事行為。","条約の締結は内閣の仕事。天皇は条約を公布する。"],
["天皇の国事行為はどちら？","憲法改正・法律・政令・条約の公布","法律の制定","憲法改正、法律、政令、条約の公布は国事行為。","法律の制定は国会の仕事。"],
["天皇の国事行為はどちら？","外国の大使・公使を迎え、接待する","外交の方針を決める","外国の大使・公使を迎え接待すること（接受）は国事行為。","外交の方針を決めるのは内閣の仕事。"],
["天皇の国事行為はどちら？","総選挙の公示","選挙への立候補","国会議員の総選挙の公示は国事行為。","天皇は選挙権をもたず、選挙に立候補することもない。"],
["恩赦（刑罰を減らすこと）について天皇が行うのは？","認証","決定","恩赦は内閣が決定し、天皇が認証する。国務大臣の任免や外交文書の認証も国事行為。","決定するのは内閣。天皇は認証するだけ。"],
["国会の開会式での「おことば」や被災地の訪問は？","政治的な権力にあたらない公的な活動","国事行為","おことば、外国の元首の接受、各地の視察、外国訪問などは、政治的な権力の行使にあたらない範囲の公的な活動。","国事行為は憲法に定められた形式的・儀礼的な行為（第6・7条）。"],
["天皇は選挙権をもっている？","もっていない","もっている","天皇は選挙権をもっていない。","国民と天皇の違い。天皇は政治に関わらないので選挙権もない。"],
["大日本帝国憲法で、主権はだれにあった？","天皇","国民","大日本帝国憲法では主権は天皇にあった。","国民主権は日本国憲法の基本原理。"],
["皇室典範で、皇位を継承するのは？","皇統に属する男系の男子","皇族の長子（男女を問わない）","皇室典範は皇位継承者を「皇統に属する男系の男子」と定めている。","男女を問わない継承は、女性・女系にも継承資格を認めるかという議論の一つで、今の皇室典範の規定ではない。"],
["現在、皇位継承の資格をもつ男性皇族は何人？","3人","5人","現在、資格をもつ男性皇族は3人。将来の安定的な皇位継承が心配されている。","5人ではない。"],
["女性皇族が天皇・皇族以外の男性と結婚すると？","皇族でなくなる","皇族の身分にとどまる","女性皇族は、天皇・皇族以外の男性と結婚すると皇族でなくなる。皇族の減少が心配されている。","結婚後も皇族の身分にとどまれるようにするかという議論はあるが、今の制度ではない。"],
["日本史上、女性天皇は何人いた？","8人","2人","日本史上の女性天皇は8人。","2人ではない。"],
["大日本帝国憲法下で、天皇は何とされていた？","神聖不可侵","象徴","大日本帝国憲法下では神聖不可侵とされた（GHQの新憲法啓発ポスター）。","象徴は日本国憲法での位置づけ。"]
]},
{id:"c7",g:"教科書 p.44〜49",t:"憲法改正の手続き",s:"教科書 p.47・資料集 p.35",q:[
["憲法改正の発議に必要なのは？","各議院の総議員の3分の2以上の賛成","各議院の出席議員の過半数","衆議院と参議院それぞれの総議員の3分の2以上の賛成で、国会が発議する（第96条）。","出席議員の過半数は、ふつうの法律を可決するときの条件。憲法改正はもっと厳しい。"],
["憲法改正を発議するのは？","国会","内閣","憲法改正は国会が発議し、国民に提案する。","内閣には憲法改正を発議する権限はない。"],
["国民投票で改正が成立する条件は？","有効投票の過半数の賛成","有効投票の3分の2以上の賛成","国民投票で有効投票の過半数の賛成を得ると改正が成立する。","3分の2以上は、国会での発議に必要な条件（各議院の総議員）。"],
["憲法改正の手続きを定めた条文は？","第96条","第9条","第96条：憲法改正の手続き。","第9条は戦争の放棄・戦力の不保持・交戦権の否認。"],
["成立した改正憲法を公布するのは？","天皇（国民の名で）","内閣総理大臣","改正が成立すると、天皇が国民の名で公布する。","公布は国事行為なので、内閣総理大臣ではなく天皇が行う。"],
["国民投票で賛成が有効投票の半数以下だと？","廃案","再投票","賛成が有効投票の半数以下なら廃案になる。","再投票のしくみはない。"],
["憲法改正原案の提出に必要なのは、衆議院議員何人以上の賛成？","100人以上","50人以上","衆議院議員100人以上の賛成で原案を提出できる。","50人以上は参議院議員の場合。"],
["憲法改正原案の提出に必要なのは、参議院議員何人以上の賛成？","50人以上","100人以上","参議院議員50人以上の賛成で原案を提出できる。","100人以上は衆議院議員の場合。"],
["憲法改正原案を審査する国会の機関は？","憲法審査会","予算委員会","原案は憲法審査会で審査される。","予算委員会は予算を審議する委員会。"],
["憲法改正の具体的な手続きを定めた「国民投票法」が施行されたのは？","2010年","1947年","国民投票法（日本国憲法の改正手続に関する法律）は2010年施行。憲法の施行以来初めて具体的な手続きを定めた。","1947年は日本国憲法が施行された年。当時は具体的な手続きを定めた法律はなかった。"],
["2018年6月以降、国民投票の投票年齢は？","満18歳以上","満20歳以上","法律の改正で、2018年6月以降は満18歳以上が投票できる。","満20歳以上は引き下げ前の年齢。"],
["憲法改正に厳しい条件がつけられている理由は？","簡単に変更されると国が不安定になり、国民も危険にさらされる","国会の仕事を減らすため","国の基本法で国民の権利を保障する憲法が簡単に変わると、国が不安定になり国民も危険にさらされる。","国会の仕事を減らすためではない。"],
["憲法改正の国民投票は、国民にとってどんな機会？","国民が直接意思を表明する重要な機会","国会議員を選ぶ機会","国民投票は、国民が直接意思を表明する重要な機会（直接民主制）。","国会議員を選ぶのは選挙（間接民主制）。"],
["改正の論点：第9条について議論されているのは？","自衛隊を憲法に明記すべきか","天皇を元首と明記すべきか","第9条の論点：自衛隊を憲法に明記すべきか、核兵器の廃絶や非核三原則を明記すべきか。","天皇を元首と明記すべきかは「天皇」についての論点。"],
["改正の論点：天皇について議論されているのは？","天皇を元首と明記すべきか","私学への助成を認めるか","天皇の論点：天皇を元首と明記すべきか。","私学への助成は第89条についての論点。"],
["改正の論点「緊急事態条項」の内容は？","非常事態で政府の権限強化や議員の任期延長を明記すべきか","新しい人権を明記すべきか","大規模災害や武力攻撃などの非常事態において、政府の権限強化や国会議員の任期延長などを明記すべきか。","新しい人権を明記すべきかは「人権」についての論点。"],
["改正の論点：第89条について議論されているのは？","私学への助成を認める表現にするか","核兵器の廃絶を明記するか","第89条は、公のお金を私立学校などに支出することを制限する条文。私学への助成を認める表現にするかが論点。","核兵器の廃絶を明記するかは第9条についての論点。"],
["改正回数が68回（2024年）と多い国は？","ドイツ","アメリカ","ドイツは68回（2024年）。上院の3分の2以上かつ下院の総議員の3分の2以上の賛成で改正。","アメリカは18回（1992年が最後の改正）。"],
["アメリカの憲法改正回数は？","18回","68回","アメリカは18回（1992年）。","68回はドイツ。"],
["アメリカで憲法改正の承認に必要なのは？","4分の3以上の州議会などの承認","国民投票の過半数","アメリカは、連邦議会両院の3分の2以上の賛成などで発議し、4分の3以上の州議会などの承認で成立する。","アメリカの改正手続きに国民投票はない。国民投票が必要なのは日本など。"]
]},
{id:"c8",g:"資料集 p.38〜45",t:"平和主義と第9条",s:"資料集 p.38",q:[
["第9条第1項の内容は？","戦争の放棄","戦力の不保持","第9条第1項：戦争の放棄。","戦力の不保持は第2項。"],
["第9条第2項の内容は？","戦力の不保持・交戦権の否認","戦争の放棄","第9条第2項：陸海空軍その他の戦力を保持しない。国の交戦権を認めない。","戦争の放棄は第1項。"],
["第9条で、国際紛争を解決する手段として永久に放棄するのは？","戦争と、武力による威嚇・武力の行使","外交交渉","国権の発動たる戦争と、武力による威嚇または武力の行使を、国際紛争を解決する手段としては永久に放棄する。","外交交渉は平和的な解決手段で、放棄するものではない。"],
["「交戦権」とは？","国家が戦争を行う権利","自分の国を守る権利","交戦権＝国家が戦争を行う権利。第9条第2項で否認されている。","自分の国を守る権利は自衛権。政府は自衛権はもっているとしている。"],
["「武力による威嚇」とは？","武力を使っておどすこと","武力で反撃すること","武力による威嚇＝武力を使っておどすこと。","武力で反撃するのは武力の行使（自衛権の行使など）。"],
["「国権の発動たる戦争」とは？","戦争を開始する意思を宣言して開始される戦争","国内で起きた内乱","国権の発動たる戦争＝戦争を開始する意思を宣言して開始される戦争。","内乱は国内の争い。国家間の戦争ではない。"],
["第9条第2項で保持しないとされているのは？","陸海空軍その他の戦力","警察","第2項：陸海空軍その他の戦力は、これを保持しない。","警察は治安を守る組織で、戦力にはあたらない。"],
["第9条の解釈の争点は？","自衛権や自衛のための実力の保有を認めているか","天皇が軍隊を指揮できるか","争点は、第9条が自衛権や自衛のための実力（戦力など）の保有を認めているかどうか。","天皇が軍隊を指揮する統帥権は大日本帝国憲法の制度。"],
["政府見解では、自衛隊は？","自衛のための必要最小限度の実力なので合憲","戦力なので違憲","政府見解：自衛権はもっているが戦力は放棄している。自衛のため戦力に至らない必要最小限度の実力はもてる → 自衛隊は合憲。","「警察力を超える実力（＝戦力）なので違憲」は、多くの憲法学者の見解。"],
["多くの憲法学者の見解では、自衛隊は？","警察力を超えるので違憲","必要最小限度なので合憲","多くの憲法学者：警察力を超える実力（＝戦力）はもてない。自衛隊は警察力を超えるので違憲。","必要最小限度の実力なので合憲、というのは政府見解。"],
["前文で確認されている「平和のうちに生存する権利」の前提は？","全世界の国民がひとしく恐怖と欠乏から免かれる","日本国民だけが安全に暮らす","前文：全世界の国民が、ひとしく恐怖と欠乏から免かれ、平和のうちに生存する権利を有することを確認する。","前文は日本国民だけでなく、全世界の国民の平和的生存権を確認している。"],
["2022年12月に保有を閣議決定したのは？","反撃能力","核兵器","2022年12月、「反撃能力」の保有を含む国家安全保障戦略を閣議決定した。","日本は非核三原則により核兵器をもたない。"],
["自国が攻撃されたときに反撃する権利は？","個別的自衛権","集団的自衛権","個別的自衛権＝他国から攻撃されたとき、自国を守るため武力で反撃する権利。政府は行使できるとしてきた。","集団的自衛権は、自国と密接な関係にある他国が攻撃されたときに反撃する権利。"],
["自国と密接な関係にある他国が攻撃されたときに反撃する権利は？","集団的自衛権","個別的自衛権","集団的自衛権＝同盟国や友好国が攻撃されたときに反撃する権利。2014年に行使容認を閣議決定、2015年に安全保障関連法が成立。","個別的自衛権は、自国が攻撃されたときに反撃する権利。"],
["8月15日正午、甲子園で選手も観客も黙祷をするのはなぜ？","1945年のこの日に戦争の終結が伝えられたから","日本国憲法が公布された日だから","1945年8月15日正午、ラジオ放送で戦争の終結が国民に伝えられた。この日に戦没者を追悼し、平和を祈って黙祷する。","日本国憲法の公布は1946年11月3日。"],

[["令状"],"令状主義","現行犯を除き、裁判官が出す令状がなければ逮捕されない（第33条）、令状がなければ住居などを捜索されない（第35条）という原則。警察や検察だけの判断で人の自由を奪えないようにしている。"],
[["罪刑法定主義"],"罪刑法定主義","どんな行為が犯罪となり、どんな刑罰が科されるかを、あらかじめ法律で定めておかなければならないという原則。法律がなければ処罰されない（第31条）。権力者が後から勝手に罰をつくることを防ぐ。"],
[["刑事補償"],"刑事補償請求権","抑留・拘禁された後に無罪となった人が、国に補償を求める権利（第40条）。補償額は拘禁1日あたり最高1万2500円。袴田さんには2025年、過去最高額の約2億1700万円が決定された。"],
[["拷問","強制や拷問"],"拷問の禁止と自白","第36条で公務員による拷問と残虐な刑罰は「絶対に」禁止される。第38条で強制・拷問・脅迫による自白は証拠にできず、自白だけで有罪にすることもできない。戦前の取り調べで拷問が行われた反省による。"],
[["取り調べの可視化"],"取り調べの可視化","取り調べの様子を録音・録画し、後から確かめられるようにすること。冤罪事件を受けて導入され、2019年から裁判員裁判の対象事件などで全過程の録音・録画が義務になった。"],
[["司法取引"],"司法取引","容疑者や被告人が他人の犯罪を明らかにする代わりに、自分の処分を軽くしてもらう制度。2018年に日本でも導入された。うその証言で他人を冤罪に巻き込む危険も指摘されている。"],
[["死刑囚"],"死刑制度","日本では殺人など重大な犯罪に死刑が定められている。犯罪を防ぐ効果や被害者感情を理由に存続を支持する意見が多い一方、冤罪の場合に取り返しがつかないことなどから廃止を求める意見もある。世界では死刑を廃止した国が多数。"],
[["奴隷的拘束"],"奴隷的拘束・苦役からの自由","第18条：だれも奴隷のように拘束されず、犯罪による処罰の場合を除いて、意思に反して苦しい労働をさせられない。"],
[["職業選択の自由","経済活動の自由"],"経済活動の自由","自由権の一つ。住む場所や職業を自由に選ぶ自由（第22条）、財産権（第29条）など。ただし、公共の福祉のために制限されることがある。"],
[["枢密院"],"枢密院","大日本帝国憲法のもとで、天皇の相談に応じて憲法や重要な国務を審議した機関。日本国憲法も帝国議会の可決の後に枢密院で可決された。日本国憲法の施行とともに廃止された。"],
[["文化の日","憲法記念日"],"文化の日と憲法記念日","日本国憲法が公布された11月3日は「文化の日」、施行された5月3日は「憲法記念日」として国民の祝日になっている。"],
[["剣璽等承継の儀"],"剣璽等承継の儀","天皇が即位するとき、皇位のしるしとされる剣と璽（まがたま）などを受け継ぐ儀式。2019年5月1日、今の天皇の即位のときに国事行為として行われた。"],
[["文化勲章"],"文化勲章","文化の発展に特に大きな功績のあった人に贈られる勲章。毎年11月3日（文化の日）に、皇居で天皇から授与される。栄典の授与は天皇の国事行為。"],
[["上皇"],"上皇","退位した天皇。2019年4月30日、明仁天皇が「天皇の退位等に関する皇室典範特例法」に基づいて退位し、上皇となった。天皇の退位は約200年ぶりだった。"],
[["旧宮家"],"旧宮家","1947年、GHQの方針などにより皇族の身分を離れた11の宮家。皇族の減少への対策として、その子孫の男性が皇族に戻れるようにする案が議論されている。"],
[["公的な活動","おことば"],"天皇の公的な活動","国事行為以外に、天皇が象徴として行う活動。国会開会式での「おことば」、外国の元首の接受、被災地の訪問、外国訪問など。政治的な権力の行使にあたらない範囲で行われる。"],
[["専守防衛"],"専守防衛","相手から攻撃を受けたときに初めて防衛力を使い、その程度も必要最小限にとどめるという日本の防衛の基本方針。反撃能力の保有がこれに反しないかが議論された。"],
[["国家安全保障戦略"],"国家安全保障戦略","日本の外交・防衛の基本方針を示す文書。2013年に初めてつくられ、2022年12月の改定で反撃能力の保有や、防衛費を大幅に増やす方針が盛り込まれた。"],
[["日米同盟"],"日米同盟","日米安全保障条約に基づく日本とアメリカの協力関係。日本は基地を提供し、アメリカは日本の防衛に協力する。冷戦後も、アジア太平洋の安定のために重要とされている。"],
[["尖閣諸島"],"尖閣諸島","沖縄県石垣市に属する東シナ海の島々。日本が管理しているが、中国・台湾が領有権を主張している。2010年には中国漁船が海上保安庁の巡視船に衝突する事件が起きた。"],
[["南シナ海","南沙諸島"],"南シナ海の領有権争い","南シナ海の南沙諸島などをめぐり、中国・フィリピン・ベトナムなど複数の国と地域が領有権を争っている。中国は岩礁を埋め立てて人工島をつくり、軍事拠点化を進めている。"],
[["北朝鮮"],"北朝鮮の核・ミサイル問題","北朝鮮は2003年に核拡散防止条約からの脱退を宣言し、2006年から核実験をくり返している。弾道ミサイルが日本の排他的経済水域に落下することもあり、日本の安全保障上の大きな課題になっている。"],
[["国連軍","多国籍軍"],"国連軍と多国籍軍","国連憲章が定める正式な国連軍は、これまで一度も組織されたことがない。安全保障理事会の決議などに基づいて各国が軍を出し合うのが多国籍軍（例：湾岸戦争）。日本は武力を用いるこれらへの参加は認めていない。"],
[["安全保障理事会","安保理"],"国連安全保障理事会","国際平和と安全の維持に責任をもつ国連の機関。常任理事国5か国（アメリカ・イギリス・フランス・ロシア・中国）と非常任理事国10か国からなる。常任理事国は拒否権をもち、1か国でも反対すると重要な決定ができない。"],
[["GDP","国内総生産"],"GDP（国内総生産）","国内で1年間に新たに生産されたモノやサービスの価値の合計。国の経済の大きさを表す。防衛費をGDPの何%にするか、という形で議論される。"],
[["防衛関係費","防衛費"],"日本の防衛費","日本の防衛関係費は1960年代から増え続け、2023年度は約6.6兆円。2022年の閣議決定で、2027年度に防衛費と関連経費をあわせてGDPの2%にする方針が示された。"],
[["治安維持法"],"治安維持法","1925年に制定された法律。もとは共産主義などを取り締まる目的だったが、のちに政府に反対する人々の言論や思想を広く弾圧するのに使われた。1945年に廃止された。"],
[["マグナ・カルタ"],"マグナ・カルタ（大憲章）","1215年、イギリスで貴族たちが国王に認めさせた文書。王でも勝手に税を取ったり人を逮捕したりできないとし、法の支配の出発点とされる。"],
[["権利章典"],"権利章典","1689年、イギリスの名誉革命の後に定められた法律。議会の同意なしに国王が法律を停止したり税を課したりすることを禁じ、議会政治の基礎となった。"],
[["アメリカ独立宣言"],"アメリカ独立宣言","1776年、イギリスからの独立にあたって発表された宣言。すべての人は平等につくられ、生命・自由・幸福追求の権利をもつとした。日本国憲法第13条の幸福追求権にもつながっている。"],
[["フランス人権宣言"],"フランス人権宣言","1789年、フランス革命の中で出された宣言。人は生まれながらにして自由・平等であるとし、国民主権や権力分立をうたった。"],
[["ワイマール憲法"],"ワイマール憲法","1919年にドイツで制定された憲法。世界で初めて社会権（人間らしい生活を保障される権利）を定めた。のちにナチスの台頭で骨抜きにされた。"],
[["世界人権宣言"],"世界人権宣言","1948年12月10日に国連で採択された、すべての人と国が守るべき人権の基準を示した宣言。12月10日は「人権デー」とされている。"],
[["生存権"],"生存権（第25条）","「健康で文化的な最低限度の生活を営む権利」。社会権の中心で、生活保護などの社会保障制度のもとになっている。"],
[["プライバシー"],"プライバシーの権利","私生活をみだりに公開されない権利。さらに、自分の個人情報を自分でコントロールする権利としても考えられている。憲法に直接の規定はなく、新しい人権の一つ。"],
[["人工知能","AI"],"人工知能（AI）","人間のように学習・判断を行うコンピュータの技術。便利になる一方、個人情報の扱い、差別的な判断、仕事への影響など、人権や生命・人間とは何かを考える上での新しい課題を生んでいる。"],
[["いじめ"],"いじめ防止","いじめは、いじめを受けた人の尊厳を傷つける重大な人権侵害。2013年にいじめ防止対策推進法が制定され、学校や地域で防止に取り組むことが定められた。"],
[["障がいのある人"],"障がいのある人の人権","障がいを理由とする差別をなくすため、2013年に障害者差別解消法が制定された。社会のしくみや設備を整え、だれもが暮らしやすい社会をめざすバリアフリーやユニバーサルデザインの考え方が広がっている。"],
[["地方選挙権"],"外国人の地方選挙権","日本に住む外国人に、地方自治体の選挙権を認めるかどうかの議論。1995年に最高裁判所は、法律で認めることは憲法上禁止されていないという考えを示したが、まだ法律はつくられていない。"],
[["ファシズム"],"ファシズム","個人の自由よりも国家や民族を優先し、独裁と武力で支配する政治のあり方。イタリアのムッソリーニやドイツのヒトラーが代表的。"],
[["議院内閣制"],"議院内閣制","内閣が国会の信任に基づいて成立し、国会に対して責任を負うしくみ。内閣総理大臣は国会議員の中から国会が指名し、国務大臣の過半数は国会議員でなければならない。"],
[["琉球処分"],"琉球処分","明治政府が1872年に琉球藩を置き、1879年に沖縄県を設置して琉球王国を廃止した一連の政策。"],
[["騒音"],"基地の騒音問題","普天間飛行場や嘉手納飛行場の周辺では、軍用機の騒音で授業が中断されるなど、住民の生活に大きな影響が出ている。住民は国を相手に訴訟を起こしてきた。"],
[["有効投票"],"有効投票と過半数","有効投票とは、白票などの無効票を除いた、正しく投票された票のこと。憲法改正の国民投票では、賛成が有効投票の半分より多い（過半数）ときに改正が成立する。"],
[["平和のうちに生存する権利"],"平和的生存権","前文で確認された「全世界の国民が恐怖と欠乏から免かれ、平和のうちに生存する権利」。戦争の恐怖だけでなく、貧困（欠乏）からも解放されることを含む。"],
[["顔認証"],"顔認証システムとプライバシー","カメラの映像から顔の特徴を読み取り、本人かどうかを自動で確認する技術。空港の搭乗手続きや買い物の支払いが便利になる一方、顔のデータが漏れたり、知らないうちに行動を追跡されたりするおそれがあり、プライバシーの権利（新しい人権）との関係が課題になっている。"],
[["国の基本を定めた","=憲法"],"憲法","国の基本的なあり方を定めた、最も上位にある法。国民の権利を保障し、それを実現するための政治のしくみ（国会・内閣・裁判所など）を定める。日本国憲法は前文と103の条文からなる。"],
[["=法律"],"法律","国会の議決によって制定されるきまり。憲法の下に位置し、憲法に反する法律はつくれない。内閣も法案を国会に提出できるが、決めるのは国会。"],
[["イタリア共和国憲法","大韓民国憲法","軍政の廃止"],"第二次世界大戦後の新しい憲法","大戦後、多くの国が独裁・戦争・差別への反省から、国民主権・人権保障・権力の制限を定めた憲法をつくった。イタリアはファシズム（ムッソリーニの独裁）と王政を終わらせて共和国となり、韓国は軍事政権から民主化を進めて1987年に憲法を改正した。"],
[["ベアテ"],"ベアテ＝シロタ＝ゴードン","1923年ウィーン生まれ。ピアニストの父が東京音楽学校に招かれ、5歳から15歳まで日本で暮らした。戦後、GHQの民間要員として来日し、日本語ができたことから人権条項の草案づくりを担当。日本の女性の地位の低さを知っていたことが、男女平等の条文につながった。"],
[["三つの基本原理","改正できない"],"三つの基本原理と改正の限界","国民主権・基本的人権の尊重・平和主義は日本国憲法の柱。これらを否定する改正は、憲法の土台そのものを壊すことになるため、改正の限界をこえて認められないという考え方が有力。"],
[["第15条"],"選挙の原則","日本の選挙は、普通選挙（一定の年齢以上のすべての国民が投票できる）、平等選挙（1人1票）、秘密選挙（だれに投票したか秘密）、直接選挙の4原則で行われる。第15条は公務員を選ぶことを国民固有の権利と定め、第43・44条は国会議員の選挙を定める。"],
[["男性皇族","女性皇族"],"皇位継承をめぐる議論","今の皇室典範では男系の男子しか天皇になれず、女性皇族は皇族以外と結婚すると皇族でなくなる。皇族が減ると安定した継承が難しくなるため、女性・女系天皇を認める案、女性皇族が結婚後も皇族に残る案、旧宮家の男性の皇族復帰を認める案などが議論されている。"],
[["アメリカで憲法改正","改正回数","憲法改正回数"],"各国の憲法改正","ドイツ（68回）やフランス（25回）は憲法に細かい規定が多く、時代に合わせて改正を重ねてきた。アメリカは元の条文を残したまま修正条項を書き足す方式で、奴隷制の廃止や女性参政権もこの方法で加えられた。日本国憲法は一度も改正されていない。"],
[["ストライク"],"戦時中の「敵性語」","太平洋戦争中、英語は敵の言葉（敵性語）とされ、野球の用語も「ストライク→よし、一本」のように日本語に言いかえられた。言葉や文化まで統制された戦時体制の様子を表している。"],
[["へいわとせんそう","谷川俊太郎"],"谷川俊太郎","日本を代表する詩人（1931〜2024年）。教科書にも多くの詩が載り、アニメ「鉄腕アトム」の主題歌の作詞でも知られる。絵本『へいわとせんそう』は、同じ場面を平和のときと戦争のときで比べて描いている。"],
[["吉田首相","吉田茂"],"吉田茂","戦後の首相（1946〜47年、1948〜54年）。日本国憲法の制定時の首相で、サンフランシスコ平和条約と日米安保条約に調印した。経済の復興を最優先し、防衛はアメリカに頼る路線をとった。"],
[["在日米軍","米軍専用施設","米軍駐留経費","米軍基地について"],"在日米軍","日米安全保障条約に基づいて日本に駐留するアメリカ軍。約5万人が陸・海・空軍や海兵隊の基地に置かれている。専用施設の約7割が、国土面積の約0.6%しかない沖縄県に集中していることが大きな問題になっている。"],
[["国防費","正規兵力"],"世界の国防費","アメリカの国防費は世界最大で、2位以下を大きく引き離している。中国は経済成長とともに国防費を急速に増やし、兵力は世界最大。日本の国防費は経済規模に比べて低い水準だったが、2022年に大幅増額の方針を決めた。"],
[["高校生平和大使"],"高校生平和大使","1998年から長崎の市民団体が派遣している。選ばれた高校生がスイス・ジュネーブの国連欧州本部を訪れ、核兵器の廃絶を求める署名を届けたりスピーチをしたりする。「微力だけど無力じゃない」を合言葉に活動している。"],
[["県民所得","基地収入","基地返還"],"基地と沖縄の経済","基地で働く人の給料や軍用地料などの基地関連収入がある一方、広大な基地があると道路や商業施設の開発ができない。返還された土地が商業地や住宅地に生まれ変わり、経済効果が何十倍にもなった例から、基地は経済発展の妨げとの見方が強まっている。"],
[["獲得されてきた"],"人権の歩み","1215年のマグナ・カルタ、1689年の権利章典（イギリス）、1776年のアメリカ独立宣言、1789年のフランス人権宣言で自由権・平等権が確立。1919年のワイマール憲法で社会権が登場し、1948年には国連で世界人権宣言が採択された。人々の主張と努力で一つずつ広がってきた。"],
[["外国人"],"外国人の人権","人権は人間として生まれながらにもつ権利なので、日本に住む外国人にも保障される。ただし国の政治を決める参政権は、国民主権の考えから日本国籍をもつ人に限られてきた。外国人に地方選挙権を認めるかは議論が続いている。"],
[["国家が強大な権力","立憲主義"],"立憲主義","憲法で国家権力をしばり、国民の人権を守る考え方。17〜18世紀のイギリス・アメリカ・フランスの市民革命の中で、王の権力を制限しようとして発展した。権力は暴走しやすいという反省から、権力分立や違憲審査などのしくみとセットで使われる。"],
[["法の支配"],"法の支配","政治は、国民の代表である議会がつくった法に従って行わなければならないという考え方。13世紀のイギリスのマグナ・カルタ（大憲章）で王の権力を制限したことが始まりとされる。権力者も法の下にある、という点がポイント。"],
[["人の支配"],"人の支配","君主や独裁者が法にしばられず、思うままに国民を支配する政治。権力者の気分しだいで人々の自由や財産が奪われる危険がある。これに対抗して生まれた考え方が法の支配。"],
[["権力分立"],"権力分立（三権分立）","国の権力を立法（国会）・行政（内閣）・司法（裁判所）に分け、互いに抑制し合ってバランスをとるしくみ。フランスのモンテスキューが『法の精神』（1748年）で唱えた。一つの機関に権力が集まると独裁につながるため、それを防ぐ。"],
[["民主主義"],"民主主義","国民が政治の主役となり、話し合いと多数決などで物事を決めるしくみ・考え方。古代ギリシャのアテネで始まり、市民革命を経て広がった。少数意見の尊重も大切にされる。"],
[["最終的に決める","国民主権"],"国民主権","国の政治のあり方を最終的に決める力（主権）が国民にあるという原理。日本国憲法の三つの基本原理の一つ。国民は選挙・国民投票・国民審査などで意思を示す。大日本帝国憲法では主権は天皇にあった（天皇主権）。"],
[["基本的人権の尊重","基本的人権"],"基本的人権の尊重","人が生まれながらにもつ権利を、国家が侵してはならないものとして保障する原理。日本国憲法の三つの基本原理の一つ。自由権・平等権・社会権・参政権・請求権などがある（第11条：侵すことのできない永久の権利）。"],
[["平和主義"],"平和主義","戦争を放棄し、戦力をもたず、国際協調によって平和を守るという原理。第二次世界大戦で国内外に多くの犠牲を出した反省から、前文と第9条に定められた。"],
[["最高法規"],"最高法規","国の法の中でいちばん上に位置する法。憲法は国の最高法規で、これに反する法律や命令は効力をもたない（第98条）。天皇や国務大臣、国会議員、公務員などには憲法を尊重し守る義務がある（第99条）。"],
[["憲法に反する法律","違憲審査権"],"違憲審査権","法律や命令、国の行為が憲法に違反していないかを判断する裁判所の権限（第81条）。最終的な判断をする最高裁判所は「憲法の番人」とよばれる。大日本帝国憲法の裁判所にはなかった。"],
[["=命令","「命令」"],"命令（政令・省令）","内閣が定める政令、各省が定める省令など。法律を実行するための細かいルールを決める。法律に反する内容は定められない。"],
[["=規則"],"規則","最高裁判所が定める裁判所規則や、衆議院・参議院がそれぞれ定める議院規則など、国会以外の機関が定めるきまり。"],
[["ナチズム"],"ナチズム","ヒトラーが率いたナチス（国民社会主義ドイツ労働者党）の思想。独裁政治を行い、ユダヤ人などを迫害・大量虐殺し、第二次世界大戦を引き起こした。戦後のドイツ基本法は、その反省から人間の尊厳の保障を第1条に置いた。"],
[["アパルトヘイト"],"アパルトヘイト","南アフリカで行われていた、白人以外の人々を差別・隔離する人種隔離政策。住む場所や結婚、選挙権まで制限した。1991年に関連法が廃止され、1994年にマンデラが初の黒人大統領となり、1996年の新憲法で平等が定められた。"],
[["ポツダム宣言"],"ポツダム宣言","1945年7月、アメリカ・イギリス・中国の名で日本に降伏を求めた宣言（のちにソ連も加わる）。軍国主義の除去、民主主義の復活・強化、基本的人権の尊重などを求めた。日本は8月14日に受け入れ、15日に国民に伝えられた。"],
[["カイロ宣言"],"カイロ宣言","1943年、アメリカ・イギリス・中国の首脳がエジプトのカイロで話し合って発表した宣言。日本が奪った満州・台湾などを中国に返すことなど、戦後の日本の領土の扱いを示した。ポツダム宣言は、カイロ宣言の内容を実行すると述べている。"],
[["GHQ"],"GHQ（連合国軍最高司令官総司令部）","マッカーサーを最高司令官として、1945年から1952年まで日本を占領した組織。財閥解体・農地改革・女性参政権・教育改革など、日本の民主化政策を次々に進めた。"],
[["マッカーサー三原則"],"マッカーサー三原則","GHQ草案をつくるためにマッカーサーが示した三つの方針（マッカーサー・ノート）。①天皇は国家元首の地位にある ②戦争を放棄する ③日本の封建制度を廃止する。これをもとにGHQは約1週間で草案をつくった。"],
[["マッカーサー"],"マッカーサー","アメリカの軍人。連合国軍最高司令官として日本の占領政策を指揮し、日本政府に憲法改正を指示した。朝鮮戦争中の1951年に解任され、帰国した。"],
[["松本案","憲法改正要綱"],"松本案（憲法改正要綱）","幣原内閣の国務大臣・松本烝治を中心にまとめた政府の憲法改正案。天皇が統治権をもつなど大日本帝国憲法とほとんど変わらず、新聞にスクープされると「保守的すぎる」と批判され、GHQにも拒否された。"],
[["GHQ草案"],"GHQ草案","政府の松本案を拒否したGHQが、マッカーサー三原則をもとに1946年2月につくった憲法草案。国民主権・象徴天皇・戦争放棄・人権保障などを含み、日本政府はこれをもとに憲法改正案をつくった。"],
[["封建制度"],"封建制度","主君が家臣に土地を与え、家臣が忠誠を誓って仕える身分制度のしくみ。マッカーサー三原則でいう「封建制度の廃止」には、華族（貴族）制度の廃止などが含まれる。"],
[["憲法草案要綱"],"憲法草案要綱","民間の憲法研究会（高野岩三郎・鈴木安蔵ら）が1945年12月に発表した草案。国民主権や生存権などを盛り込み、GHQから「民主主義的で賛成できる」と高く評価された。日本人自身の考えが新憲法に生かされた例。"],
[["帝国議会"],"帝国議会","大日本帝国憲法のもとでの議会（1890年開設）。選挙で選ばれる衆議院と、皇族・華族や天皇が任命した議員からなる貴族院の二院制。天皇の立法に協賛（同意）する機関で、日本国憲法の国会のような最高機関ではなかった。"],
[["貴族院"],"貴族院","帝国議会の一院。皇族・華族や、天皇が任命した議員などで構成され、選挙はなかった。衆議院と対等の力をもっていた。日本国憲法で廃止され、選挙で選ばれる参議院に変わった。"],
[["公布"],"公布","成立した法を国民に広く知らせること。日本国憲法は1946年11月3日（明治天皇の誕生日、今の文化の日）に公布された。"],
[["施行"],"施行","法が実際に効力をもちはじめること。日本国憲法は公布から6か月後の1947年5月3日に施行され、この日は憲法記念日になった。"],
[["衆議院議員選挙","女性が初めて"],"女性参政権の実現","1945年12月の選挙法改正で、満20歳以上のすべての男女に選挙権が認められた。1946年4月の衆議院議員選挙で女性が初めて投票し、39人の女性議員が当選した。この議会で日本国憲法が審議された。"],
[["人間宣言","新日本建設に関する詔書"],"人間宣言","1946年1月1日の「新日本建設に関する詔書」の通称。天皇を現御神（生きている神）とし、日本民族が世界を支配する使命をもつという考えを否定した。詔書とは、天皇が発する公式の文書のこと。"],
[["8月15日","終戦の詔書","玉音放送"],"終戦の詔書（玉音放送）","1945年8月15日正午、昭和天皇がラジオで読み上げ、戦争の終結を国民に伝えた詔書。天皇の声が初めてラジオで流れ、玉音放送とよばれる。この日が「終戦の日」とされる。"],
[["五箇条の御誓文"],"五箇条の御誓文","1868年、明治天皇が神に誓う形で示した新政府の基本方針。「広く会議を興し万機公論に決すべし」（政治はみんなの意見を聞いて決める）などが書かれている。戦後、民主主義の原点が日本にもあったと示すために引用された。"],
[["教育勅語"],"教育勅語","1890年に出された、明治天皇が教育の基本方針を示した言葉。親孝行などの道徳とともに、国のために尽くすこと（忠君愛国）を説き、学校で読み上げられた。戦後の1948年、国会で失効が決議された。"],
[["エレノア"],"エレノア＝ルーズベルト","アメリカのフランクリン・ルーズベルト大統領の妻。国連人権委員会の委員長として、1948年に国連で採択された世界人権宣言の作成を主導した。"],
[["両性の本質的平等"],"両性の本質的平等（第24条）","結婚は両性の合意のみで成立し、夫婦は同等の権利をもつ。家族に関する法律は個人の尊厳と両性の本質的平等に基づいて定める。戦前の家制度では、結婚に戸主（家の長）の同意が必要で、妻の財産権も制限されていた。"],
[["社会保障"],"社会保障","病気・老い・失業などで生活が苦しくなった人を、国が支えるしくみ。社会保険・公的扶助・社会福祉・公衆衛生の4つが柱。第25条の生存権（健康で文化的な最低限度の生活を営む権利）がもとになっている。"],
[["大日本帝国憲法"],"大日本帝国憲法（明治憲法）","1889年2月11日に発布、1890年11月29日に施行された日本初の近代憲法。伊藤博文らがドイツ（プロイセン）の憲法を参考につくった。天皇が主権をもつ欽定憲法で、国民の権利は法律の範囲内でしか認められなかった。"],
[["欽定憲法","欽定"],"欽定憲法","君主が定めて国民に与える憲法。大日本帝国憲法やプロイセン憲法がこれにあたる。"],
[["民定憲法","民定"],"民定憲法","国民（または国民の代表）が定める憲法。日本国憲法やアメリカ合衆国憲法などがこれにあたる。"],
[["臣民"],"臣民","君主に支配される民のこと。大日本帝国憲法では国民は「臣民」とよばれ、権利は「法律の範囲内」でしか認められなかった。そのため治安維持法などの法律で言論や思想が厳しく制限された。"],
[["統帥権"],"統帥権","軍隊を指揮・命令する権限。大日本帝国憲法では天皇がもち、内閣や議会も口出しできないとされた（統帥権の独立）。昭和期に軍部がこれを盾に政治を左右し、戦争への道を進む原因になった。"],
[["統治権"],"統治権","国の領土や国民を治める権限全体のこと。大日本帝国憲法では天皇が統治権を総攬する（すべてまとめてもつ）とされた。"],
[["軍隊に入ることを義務","徴兵制"],"徴兵制","国民に一定期間、兵役（軍隊に入ること）を義務づける制度。日本では1873年の徴兵令で始まり、満20歳の男子に兵役の義務があった。1945年の敗戦で廃止された。今も韓国やスイスなどには徴兵制がある。"],
[["普通教育を受けさせる","勤労・納税"],"国民の三つの義務","日本国憲法の義務は、子どもに普通教育を受けさせる義務（第26条）、勤労の義務（第27条）、納税の義務（第30条）の三つ。義務より権利の規定がずっと多いのが日本国憲法の特徴。"],
[["「戦力」","戦力不保持","戦力の不保持"],"戦力の不保持","第9条第2項で「陸海空軍その他の戦力は、これを保持しない」と定めたもの。自衛隊が「戦力」にあたるかどうかが、憲法をめぐる大きな議論になってきた。"],
[["国権の最高機関","唯一の立法機関"],"国会（国権の最高機関）","国会は主権者である国民が選んだ代表者で構成されるため、国の政治の中心となる「国権の最高機関」とされる。法律をつくれるのは国会だけなので「唯一の立法機関」でもある（第41条）。"],
[["協賛"],"協賛","賛成して力を貸すこと。大日本帝国憲法では立法権は天皇にあり、帝国議会はそれに同意する協賛機関にすぎなかった。"],
[["輔弼"],"輔弼","天皇を助けて政治を行うこと。大日本帝国憲法では国務大臣がそれぞれ天皇を輔弼し、議会や国民ではなく天皇に対して責任を負った。内閣は憲法に定められていなかった。"],
[["行政の執行","政策を実現する機関"],"内閣（日本国憲法）","内閣総理大臣と国務大臣で構成され、法律に従って政治を行う行政の最高機関。国会の信任に基づいて成立し、国会に対して連帯して責任を負う（議院内閣制）。"],
[["司法権の独立"],"司法権の独立","裁判所が国会や内閣などから干渉を受けず、裁判官は良心に従い、憲法と法律にのみしばられるという原則（第76条）。公正な裁判のために欠かせない。"],
[["前文"],"前文","憲法の最初に置かれた文章。憲法を定めた理由や、国民主権・平和主義などの理念を述べている。条文と同じく法的な意味をもつ。"],
[["何回改正","改正されてこなかった","厳しい条件","硬性憲法"],"硬性憲法","改正の手続きが、ふつうの法律をつくる手続きより厳しい憲法。国の土台が多数派の都合で簡単に変えられないようにするため。日本国憲法やアメリカ合衆国憲法など、多くの国の憲法がこれにあたる。"],
[["軟性憲法"],"軟性憲法","ふつうの法律と同じ手続きで改正できる憲法。イギリスはまとまった憲法典がなく、議会の法律などで国のしくみが決まるため、軟性憲法の代表とされる。"],
[["あたらしい憲法のはなし"],"『あたらしい憲法のはなし』","1947年に文部省が中学1年生向けに発行した教科書。戦争放棄を「兵隊も軍艦も飛行機も、およそ戦争をするためのものは、いっさいもたない」と説明し、さし絵とともに知られる。1952年ごろまで使われた。"],
[["主権とは","「主権」","主権者","主権の存する"],"主権","主権には3つの意味がある。①他国に支配・干渉されない国家の独立性 ②領土・国民を治める統治権 ③国の政治のあり方を最終的に決める権利。「国民主権」の主権は③の意味。"],
[["国会議員は国会で","間接民主制"],"間接民主制（議会制民主主義）","国民が選挙で代表者を選び、代表者が議会で話し合って決めるしくみ。人口の多い国で全員が集まって決めるのは難しいため、多くの国で採用されている。"],
[["直接民主制"],"直接民主制","国民が代表者を通さず、直接政治に参加して決めるしくみ。古代ギリシャのアテネの民会や、スイスの一部の州の住民集会が有名。日本では国民投票・国民審査・住民投票・直接請求権に取り入れられている。"],
[["国民投票"],"国民投票","憲法改正の発議を受けて、国民が賛成・反対を投票すること（第96条）。日本ではまだ一度も行われていない。"],
[["国民審査"],"国民審査","最高裁判所の裁判官がふさわしいかを国民が審査する制度（第79条）。衆議院議員総選挙のときに行われ、辞めさせたい裁判官に×をつける。×が過半数だと罷免される（辞めさせられる）が、これまで罷免された例はない。"],
[["住民投票"],"住民投票","特定の地方公共団体だけに適用される特別法を国会がつくるとき、その住民が投票で賛否を示す（第95条）。また、地方の重要な問題について条例に基づく住民投票も行われている（例：2019年の沖縄県民投票）。"],
[["直接請求権"],"直接請求権","地方自治で、住民が一定数の署名を集めて、条例の制定・改廃、監査、議会の解散、首長・議員の解職（リコール）などを請求できる権利。"],
[["裁判員制度"],"裁判員制度","2009年に始まった制度。くじで選ばれた国民（2023年から18歳以上）が裁判員となり、重大な刑事裁判で裁判官とともに有罪・無罪や刑の重さを決める。国民の感覚を裁判に反映させるのが目的。"],
[["天皇は選挙権","象徴天皇制","日本国民統合の象徴"],"象徴天皇制","天皇を「日本国の象徴であり日本国民統合の象徴」とする制度（第1条）。天皇は政治的な権限をもたず、内閣の助言と承認のもとで国事行為のみを行う。天皇の地位は国民の総意に基づく。"],
[["立憲君主制"],"立憲君主制","君主がいるが、その権力を憲法で制限する政治のしくみ。イギリスやスウェーデンなど。君主が憲法にしばられずに支配する絶対君主制と対比される。"],
[["国政に関する権能","国事行為"],"国事行為","憲法に定められた、天皇が行う形式的・儀礼的な行為（第6・7条）。内閣総理大臣の任命、法律の公布、国会の召集、衆議院の解散、栄典の授与など。すべて内閣の助言と承認が必要で、内閣が責任を負う。"],
[["内閣総理大臣の任命","内閣総理大臣を任命"],"内閣総理大臣の指名と任命","内閣総理大臣は国会議員の中から国会が指名し、天皇が任命する（第6・67条）。衆議院と参議院の指名が違うときは、衆議院の指名が優先される。"],
[["最高裁判所長官"],"最高裁判所長官","最高裁判所の長。内閣が指名し、天皇が任命する。その他の14人の最高裁判所裁判官は内閣が任命する。"],
[["衆議院の解散"],"衆議院の解散","衆議院議員の任期（4年）が終わる前に、全員の議員の資格を失わせること。内閣が決め、天皇が国事行為として行う。解散後40日以内に総選挙が行われる。"],
[["国会の召集"],"国会の召集","国会の会期を始めるために議員を集めること。毎年1月に召集される通常国会（常会）などがある。召集を決めるのは内閣で、天皇が国事行為として行う。"],
[["栄典"],"栄典","国が功績のあった人をたたえて与える勲章や褒章など。文化の発展に大きな功績のあった人に贈る文化勲章などが有名。天皇が国事行為として授与する。"],
[["条約の締結"],"条約","国と国との間の文書による約束。内閣が締結し、国会が承認し、天皇が国事行為として公布する。"],
[["恩赦"],"恩赦","国の祝い事などの際に、裁判で決まった刑罰を減らしたり免除したりすること。内閣が決定し、天皇が認証する。"],
[["=認証"],"認証","ある行為が正しい手続きで行われたことを、公に証明すること。国務大臣や大使の任免、恩赦などを天皇が認証する。"],
[["皇室典範","男系の男子"],"皇室典範","皇位の継承や皇族の身分などを定めた法律。皇位は「皇統に属する男系の男子」が継ぐと定めている。男系とは、父方をたどると天皇につながる血筋のこと。"],
[["女性天皇"],"女性天皇","日本史上の女性天皇は8人（10代）。推古天皇・持統天皇などがいて、江戸時代の後桜町天皇が最後。いずれも父方が天皇の血筋（男系）で、母方だけで天皇につながる女系天皇はいない。"],
[["発議","第96条","総議員の3分の2"],"憲法改正の手続き（第96条）","①各議院の総議員の3分の2以上の賛成で国会が発議 → ②国民投票で有効投票の過半数の賛成 → ③天皇が国民の名で公布。ふつうの法律（出席議員の過半数）より厳しいのは、国の土台を簡単に変えないため。"],
[["国民投票法"],"国民投票法","2007年に成立し2010年に施行された、憲法改正の国民投票の手続きを定めた法律。投票年齢は2018年6月から満18歳以上になった。それまで、憲法改正の具体的な手続きを定めた法律はなかった。"],
[["満18歳以上"],"18歳への引き下げ","国民投票の投票年齢は2018年から満18歳以上。選挙権も2016年から満18歳以上に引き下げられた。若い世代の意見を政治に反映させるのがねらい。"],
[["憲法改正原案","憲法審査会"],"憲法審査会","2007年に衆議院・参議院にそれぞれ設けられた機関。憲法改正原案の審査や、憲法についての調査を行う。国会議員が憲法改正原案を提出するには、衆議院では100人以上、参議院では50人以上の賛成が必要。"],
[["緊急事態"],"緊急事態条項","大地震や戦争などの非常時に、内閣に特別な権限を与えたり、選挙ができない場合に国会議員の任期を延ばしたりする規定。必要だという意見がある一方、権力の乱用につながるという反対意見もある。"],
[["第89条","私学"],"第89条と私学助成","第89条は、公のお金を宗教団体や「公の支配に属しない」教育などの事業に使ってはならないと定める。私立学校への助成金がこれに反しないかという議論があり、改正の論点になっている。"],
[["元首"],"元首","国を対外的に代表する人。大日本帝国憲法では天皇が元首だった。日本国憲法には元首の規定がなく、天皇を元首と明記すべきかが議論されている。"],
[["新しい人権"],"新しい人権","憲法に直接は書かれていないが、社会の変化で主張されるようになった人権。プライバシーの権利・環境権・知る権利・自己決定権など。幸福追求権（第13条）などを根拠にしている。"],
[["国権の発動","第9条"],"第9条","戦争の放棄（第1項）と、戦力の不保持・交戦権の否認（第2項）を定めた条文。日本の平和主義の中心。自衛隊が「戦力」にあたるかどうかなど、解釈をめぐって議論が続いている。"],
[["交戦権"],"交戦権","国家が戦争を行う権利。国際法上、戦争をしている国がもつ、相手国の兵力を攻撃したり占領地を管理したりする権利なども含むとされる。第9条第2項で否認されている。"],
[["威嚇"],"武力による威嚇","武力を見せつけて相手をおどし、自国の要求を通そうとすること。実際に攻撃しなくても、第9条で放棄されている。"],
[["個別的自衛権"],"個別的自衛権","自国が直接攻撃を受けたとき、自国を守るため武力で反撃する権利。国連憲章第51条で国家の固有の権利とされる。日本政府は1954年に、日本も個別的自衛権をもち行使できるとした。"],
[["集団的自衛権"],"集団的自衛権","自国と密接な関係にある国が攻撃されたとき、自国が攻撃されていなくても共同で反撃する権利。政府は長く「もっているが行使できない」としてきたが、2014年の閣議決定で限定的な行使を認め、2015年の安全保障関連法で法律にした。"],
[["集団安全保障"],"集団安全保障","国際連合の基本的なしくみ。加盟国全体で平和を守り、侵略した国には全加盟国で経済制裁や武力制裁を加える。国連安全保障理事会が決定する（国連憲章第41・42条）。"],
[["国際連合憲章","国連憲章"],"国際連合憲章","1945年に採択された国際連合の基本となる条約。武力の行使を原則として禁止し、例外として自衛権（第51条）と、安全保障理事会の決定による制裁（集団安全保障）を認めている。"],
[["自衛隊"],"自衛隊","1954年に発足した日本の防衛組織。陸上・海上・航空自衛隊がある。前身は1950年の警察予備隊、1952年の保安隊。災害救助や国際平和協力活動も行う。政府は「戦力ではなく、自衛のための必要最小限度の実力」として合憲としている。"],
[["警察予備隊"],"警察予備隊","1950年、朝鮮戦争で在日米軍が朝鮮半島へ出動したため、日本国内の治安を守る目的でGHQの指令によりつくられた組織。1952年に保安隊、1954年に自衛隊となった。"],
[["保安隊"],"保安隊","1952年、警察予備隊を改組してできた組織（海上には警備隊があった）。政府は「戦力ではなく警察上の組織」と説明した。1954年に自衛隊になった。"],
[["朝鮮戦争"],"朝鮮戦争","1950年、北朝鮮が韓国に攻め込んで始まった戦争。アメリカ中心の国連軍が韓国を、中国が北朝鮮を支援した。1953年に休戦。日本はアメリカ軍の物資の注文（特需）で経済が回復した。"],
[["サンフランシスコ平和条約"],"サンフランシスコ平和条約","1951年、日本が連合国48か国と結んだ講和条約（1952年4月発効）。吉田茂首相が調印し、日本は独立（主権）を回復した。ただし沖縄・奄美・小笠原はアメリカの統治下に残された。"],
[["日米安全保障条約","日米安保","安保条約"],"日米安全保障条約","1951年、サンフランシスコ平和条約と同じ日に調印された日米の条約。独立後も米軍が日本に駐留することを認めた。1960年に改定され共同防衛が明記された（新安保条約）が、改定時には大規模な反対運動（安保闘争）が起きた。"],
[["少女暴行事件","日米地位協定"],"日米地位協定","1960年の新安保条約に基づき、在日米軍の基地の使い方や、米軍人の法的な扱いを定めた協定。米軍人が起こした事件の捜査などでアメリカ側に有利な点が多く、沖縄などから見直しを求める声が強い。"],
[["武器輸出三原則"],"武器輸出三原則","1967年に佐藤内閣が表明した、①共産圏の国 ②国連で禁止された国 ③紛争当事国やそのおそれのある国には武器を輸出しないという方針。1976年には事実上すべての国への輸出を控えることになった。平和国家として武器で利益を得ないという考えが背景にある。2014年、防衛装備移転三原則に変わった。"],
[["防衛装備移転三原則"],"防衛装備移転三原則","2014年、武器輸出三原則に代わって閣議決定された方針。紛争当事国などへは移転しない、平和貢献や日本の安全保障に役立つ場合に限る、目的外の使用などを適正に管理する、という条件のもとで武器などの輸出を認める。"],
[["非核三原則"],"非核三原則","核兵器を「持たず、作らず、持ちこませず」という日本の基本方針。1967年に佐藤栄作首相が国会で表明し、1971年に国会で決議された。唯一の戦争被爆国としての立場が背景にあり、佐藤首相は1974年にノーベル平和賞を受賞した。一方で、アメリカの「核の傘」に守られていることとの関係も議論されてきた。"],
[["核の傘"],"核の傘","核兵器をもつ同盟国（日本の場合はアメリカ）の核の力によって、他国からの攻撃を思いとどまらせること（核抑止）。日本は非核三原則を掲げながら、安全保障ではアメリカの核の傘に頼っている。"],
[["核拡散防止条約"],"核拡散防止条約（NPT）","1968年に調印、1970年に発効。アメリカ・ロシア（ソ連）・イギリス・フランス・中国以外の国が核兵器をもつことを禁止する条約。核保有国には核軍縮の交渉義務があるが、軍縮が進まないという不満が強い。"],
[["条約採択","核兵器禁止条約"],"核兵器禁止条約","2017年7月に国連で採択され、2021年に発効した条約。核兵器の開発・保有・使用・威嚇などを全面的に禁止する。核保有国や、核の傘に頼る日本・ドイツ・韓国などは参加していない。"],
[["ICAN"],"ICAN（核兵器廃絶国際キャンペーン）","世界中のNGOの連合体。核兵器禁止条約の成立に貢献し、2017年にノーベル平和賞を受賞した。授賞式では広島の被爆者サーロー節子さんも演説した。"],
[["国境なき医師団"],"国境なき医師団","1971年にフランスで設立された医療のNGO。紛争地や災害地で国境を越えて医療活動を行い、1999年にノーベル平和賞を受賞した。"],
[["原爆ドーム","広島県産業奨励館"],"原爆ドーム","1945年8月6日の原爆で破壊された広島県産業奨励館の建物。爆心地の近くで骨組みが残り、核兵器の惨禍を伝える「負の世界遺産」として1996年に世界文化遺産に登録された。"],
[["核兵器による惨禍","原子爆弾"],"原子爆弾の投下","1945年8月6日に広島、8月9日に長崎にアメリカ軍が原子爆弾を投下した。その年のうちに広島で約14万人、長崎で約7万人が亡くなったとされ、今も放射線による健康被害に苦しむ人がいる。"],
[["GNP"],"防衛費GNP1%枠","1976年、三木内閣が防衛費をGNP（国民総生産）の1%以内にすると閣議決定した歯止め。軍事大国にならない姿勢を示したが、1986年に撤廃された。"],
[["総額明示方式"],"総額明示方式","1987年から導入された、単年度ではなく数年間の防衛費の総額をあらかじめ示す方式。GNP1%枠に代わる新たな歯止めとして考えられた。"],
[["ガイドライン"],"ガイドライン（日米防衛協力のための指針）","自衛隊と米軍の役割分担を定めたもの。1978年（ソ連の侵攻を想定）→1997年（日本周辺地域、朝鮮半島有事など）→2015年（地球規模、集団的自衛権も）と、国際情勢に合わせて改定されてきた。"],
[["冷戦"],"冷戦","第二次世界大戦後、アメリカ中心の資本主義陣営とソ連中心の社会主義陣営が、直接戦争はせずに対立した状態。1989年のマルタ会談で終結が宣言され、1991年にソ連が解体した。"],
[["ソ連"],"ソ連（ソビエト社会主義共和国連邦）","1922年に成立した世界初の社会主義国家。冷戦期にアメリカと対立した。1991年に解体し、ロシアなど15の国に分かれた。"],
[["湾岸戦争"],"湾岸戦争","1990年にイラクがクウェートに侵攻し、1991年にアメリカ中心の多国籍軍がイラクを攻撃した戦争。日本は多額の資金を出したが「人的な貢献がない」と批判され、停戦後に掃海部隊（機雷除去）をペルシャ湾に派遣した。"],
[["機雷"],"機雷","水中に置き、船が近づいたりふれたりすると爆発する兵器。戦争が終わっても海に残ると船が危険なため、取り除く作業（掃海）が必要になる。"],
[["PKO協力法","PKO"],"PKO（国連平和維持活動）とPKO協力法","PKOは、紛争地域で停戦の監視や選挙の支援などを行い、平和の維持を助ける国連の活動。1992年のPKO協力法（国際平和協力法）で自衛隊が参加できるようになり、最初の派遣先はカンボジアだった。"],
[["カンボジア"],"カンボジアへの派遣","カンボジアでは長い内戦の後、1991年に和平協定が結ばれ、国連が選挙を支援した。日本は1992年、PKO協力法に基づいて初めて自衛隊を派遣し、道路や橋の修理などを行った。"],
[["同時多発テロ"],"アメリカ同時多発テロ","2001年9月11日、テロ組織アルカイダがハイジャックした旅客機で、ニューヨークの世界貿易センタービルなどを攻撃した事件。約3000人が死亡した。アメリカはアフガニスタンを攻撃した。"],
[["テロ対策特別措置法","テロ関連3法"],"テロ対策特別措置法","2001年、同時多発テロを受けて期限つきで制定された法律。インド洋で米軍などの艦船に給油するため、自衛隊を派遣した。"],
[["イラク"],"イラク戦争とイラク派遣","2003年、大量破壊兵器を持っているとして、アメリカ・イギリスがイラクを攻撃した。フセイン政権は倒れたが、大量破壊兵器は見つからなかった。日本はイラク復興支援特別措置法で自衛隊を派遣し、給水や医療支援などを行った。"],
[["有事関連"],"有事関連法","日本が武力攻撃を受けたとき（有事）の対応を定めた法律。2003年に3法（武力攻撃事態対処法など）、2004年に7法（国民保護法など）が成立した。"],
[["防衛省","防衛庁"],"防衛省","自衛隊を管理・運営する国の機関。1954年に防衛庁として発足し、2007年に防衛省に格上げされた。"],
[["海賊対処法","ソマリア"],"海賊対処法","2009年に成立。アフリカのソマリア沖で多発した海賊から船を守るため、自衛隊が護衛活動を行えるようにした。"],
[["駆け付け警護"],"駆け付け警護","PKOなどで、離れた場所にいる国連職員やNGOの人などが武装集団に襲われたとき、自衛隊が助けに行く任務。2015年の安全保障関連法で可能になり、2016年に南スーダンに派遣された部隊に初めて与えられた。"],
[["南スーダン"],"南スーダン","2011年にスーダンから独立したアフリカの国。独立後も内戦が続き、国連PKOが活動している。日本は2012〜2017年に自衛隊を派遣した。"],
[["周辺事態"],"周辺事態法","1999年に成立した法律。日本周辺で日本の平和に重要な影響を与える事態（周辺事態）に、自衛隊が米軍に後方支援を行えるようにした。2015年に重要影響事態安全確保法に改正された。"],
[["文民統制","シビリアン・コントロール","文民"],"文民統制（シビリアン・コントロール）","軍人でない文民（政治家）が軍隊（自衛隊）をコントロールすること。戦前に軍部が政治を支配した反省から、内閣総理大臣と国務大臣は文民でなければならない（第66条）とされ、自衛隊の最高指揮監督権は内閣総理大臣がもつ。"],
[["反撃能力"],"反撃能力","相手のミサイル攻撃に対し、発射基地などを攻撃して反撃する能力（いわゆる敵基地攻撃能力）。2022年の国家安全保障戦略で保有が決まった。攻撃を受けたときにだけ防衛力を使う「専守防衛」との関係が議論されている。"],
[["存立危機事態","新3要件"],"存立危機事態と新3要件","2014年の閣議決定で示された、武力行使ができる三つの条件。①密接な関係にある他国への攻撃で日本の存立が脅かされ、国民の権利が根底から覆される明白な危険がある（存立危機事態） ②他に適当な手段がない ③必要最小限度の実力行使。"],
[["解釈改憲"],"解釈改憲","憲法の条文を変えずに、政府が解釈を変えることで、改正したのと同じ効果を生むこと。2014年の集団的自衛権の行使容認は「解釈改憲で立憲主義に反する」と批判された。一方、政府は「憲法の範囲内の解釈の変更だ」と説明した。"],
[["新聞各紙","安全保障関連法"],"安全保障関連法","2015年に成立した、10本の法改正と1本の新法（国際平和支援法）のまとまり。集団的自衛権の限定的な行使や、自衛隊の海外での活動の拡大を可能にした。国会周辺で大規模な反対デモも起きた。"],
[["重要影響事態"],"重要影響事態安全確保法","1999年の周辺事態法を2015年に改正した法律。日本の平和と安全に重要な影響を与える事態に、地域の限定なく、米軍を含む外国軍に後方支援を行えるようにした。"],
[["事態対処法"],"事態対処法","日本が武力攻撃を受けたときの対応を定めた法律（2003年の武力攻撃事態対処法）。2015年の改正で、存立危機事態にも武力を行使できるようになった。"],
[["国際平和支援法"],"国際平和支援法","2015年に新しくつくられた恒久法。国際社会の平和のために活動する外国軍隊に、自衛隊が補給・輸送などの後方支援をできるようにした。派遣のたびに特別な法律をつくる必要はなくなったが、国会の承認が必要。"],
[["時限立法"],"時限立法","有効期限を定めた法律。テロ対策特別措置法やイラク復興支援特別措置法のように、特定の目的のためにその都度つくられた。"],
[["恒久法"],"恒久法","期限を定めず、ずっと効力をもつ法律。国際平和支援法がその例。"],
[["後方支援"],"後方支援","戦闘を行う部隊に、物資の補給・輸送・医療などで協力すること。武力の行使そのものではないとされるが、戦闘と一体化してしまうという批判もある。"],
[["自己保存型","任務遂行型"],"武器使用の2つの型","自己保存型は、自分や仲間の隊員などの生命を守るため、やむを得ない場合だけ武器を使う。任務遂行型は、駆け付け警護など任務をじゃまされたときにも武器を使える。2015年の改正で任務遂行型も可能になった。"],
[["抑止力"],"抑止力","攻撃したら反撃されて損をする、と相手に思わせることで、攻撃を思いとどまらせる力。軍事同盟や防衛力の強化は抑止力を高めるという考えがある一方、軍拡競争を招くという意見もある。"],
[["思いやり予算"],"思いやり予算","在日米軍の駐留経費のうち、本来アメリカが負担する費用の一部を日本が負担するもの。1978年、円高でアメリカの負担が重くなったため、当時の防衛庁長官が「思いやり」として始めたことからこうよばれる。基地で働く日本人の給料や光熱費などに使われる。"],

/* 用語カードの検索：長い語を優先し、正解→まちがい→問題文の順で最大3枚 */
const GKEYS=[];GLOSS.forEach((e,i)=>e[0].forEach(k=>GKEYS.push([k,i])));GKEYS.sort((a,b)=>b[0].replace("=","").length-a[0].replace("=","").length);
function terms(it,lim=3){
  const out=[];
  for(const txt of [it.q[1],it.q[2],it.q[0]]){
    let t=txt;
    for(const [k,i] of GKEYS){
      if(k[0]==="="){if(t===k.slice(1)&&!out.includes(i))out.push(i);continue}
      const p=t.indexOf(k);
      if(p>=0){if(!out.includes(i))out.push(i);t=t.slice(0,p)+"＿".repeat(k.length)+t.slice(p+k.length)}
    }
  }
  return out.slice(0,lim);
}
function cardsHTML(it){
  const ts=terms(it);if(!ts.length)return"";
  return `<div class="gl"><div class="glh">もっと知ろう</div>${ts.map(i=>`<div class="gc"><b>${rb(GLOSS[i][1])}</b><p>${rb(GLOSS[i][2])}</p></div>`).join("")}</div>`;
}
function learnHTML(it,mine){
  return `<div class="lr ok"><div class="lh">○ 正解：${rb(it.q[1])}</div><p>${rb(it.q[3])}</p></div>
  <div class="lr ng"><div class="lh">× ${mine}：${rb(it.q[2])}</div><p>${rb(it.q[4])}</p></div>${cardsHTML(it)}`;
}

const TIMES=[5,7,10,15,20,30,0];

function renderSet(){
  const t=getT();
  $("tset").innerHTML='<span>制限時間</span>'+TIMES.map(v=>`<button data-t="${v}" class="${v===t?"on":""}">${v?v+"秒":"なし"}</button>`).join("");

let G=null;
function pick(cid){
  let pool=[];
  if(cid==="mix")COURSES.forEach(c=>c.q.forEach((q,i)=>pool.push({cid:c.id,i,q})));
  else{const c=COURSES[+cid];c.q.forEach((q,i)=>pool.push({cid:c.id,i,q}))}
  const fresh=shuf(pool.filter(p=>!mset(p.cid).has(p.i))),old=shuf(pool.filter(p=>mset(p.cid).has(p.i)));
  return fresh.concat(old).slice(0,5);
}
function start(cid){
  G={cid,id:cid==="mix"?"mix":COURSES[+cid].id,title:cid==="mix"?"全範囲ミックス":COURSES[+cid].t,items:pick(cid),n:0,done:[]};
  $("ctitle").textContent=G.title;
  show("game");$("expl").classList.remove("on");
  resetScene();ask();
}
function lamps(){ $("lamps").innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<G.n?"ok":i===G.n?"now":""}"></i>`).join("") }
function ask(){
  const it=G.items[G.n];
  G.side=Math.random()<.5?-1:1; // 正解の側
  G.locked=false;G.t0=performance.now();
  lamps();
  $("tbar").parentNode.style.visibility=getT()?"visible":"hidden";
  $("qno").textContent=`第${G.n+1}問`+(G.n===4?"　ラスト！":"");
  $("qtext").innerHTML=rb(it.q[0]);
  const L=G.side<0?it.q[1]:it.q[2],R=G.side<0?it.q[2]:it.q[1];
  for(const [b,t] of [[$("chL"),L],[$("chR"),R]]){b.querySelector(".tx").innerHTML=rb(t);b.className="ch";b.disabled=false}
  S.mode="approach";S.zf=24;S.chosen=0;S.fake=false;S.broken=false;
}
function choose(side){
  if(!G||G.locked||S.mode!=="approach")return;
  G.locked=true;
  const ok=side===G.side,timeout=side===0;
  if(timeout)side=-G.side;
  G.ok=ok;G.timeout=timeout;
  const bl=$("chL"),br=$("chR"),pb=side<0?bl:br;
  bl.disabled=br.disabled=true;pb.classList.add("pick");
  S.chosen=side;S.mode="pass";S.broken=!ok;S.fake=ok&&G.n===3;S.fakeDone=false;
  tone(ok?0:1,true);
}
function reveal(){
  const it=G.items[G.n],bl=$("chL"),br=$("chR");
  (G.side<0?bl:br).classList.add("right");
  if(!G.ok)(G.side<0?br:bl).classList.add("wrong");
}
function onPassed(){ // 正解の分岐を抜けた
  const it=G.items[G.n];reveal();
  markOK(it.cid,it.i);G.done.push(it);G.n++;lamps();
  flash(G.n===5?"":"正解！","#ffd75a");tone(2);
  if(G.n===5){S.mode="win";addClear(G.id);setTimeout(win,1600);return}
  $("exB").innerHTML=learnHTML(it,"もう一つの選択肢");$("exB").scrollTop=0;
  $("expl").classList.add("on");S.mode="run";
  clearTimeout(G.auto);
}
$("next").addEventListener("click",()=>{if(!G)return;$("expl").classList.remove("on");ask()});
function onFell(){
  const it=G.items[G.n];reveal();
  setTimeout(()=>{
    $("rbox").innerHTML=`<h2 class="lose">GAME OVER</h2><p class="sub2">${G.timeout?"時間切れ！　":""}${G.n}問正解で転落…（第${G.n+1}問）</p>
    <div class="miss"><div class="q">${rb(it.q[0])}</div>${learnHTML(it,G.timeout?"時間切れ（もう一つの選択肢）":"あなたの答え")}</div>
    <button class="btn" id="again">もう一度挑戦</button><button class="btn sub" id="back">コース選択へ</button>`;
    show("result");$("rbox").scrollTop=0;
  },1500);
}

let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){AC=null}}
function tone(k){
  if(!AC)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    if(k===2){o.type="triangle";o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+.09);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.start(t);o.stop(t+.5)}
    else if(k===3){o.type="sawtooth";o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(40,t+1.1);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+1.2);o.start(t);o.stop(t+1.25)}
    else{o.type="square";o.frequency.setValueAtTime(140,t);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.start(t);o.stop(t+.16)}
  }catch(e){}
}

/* ============ 洞窟シーン（canvas） ============ */
const cv=$("cv"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function size(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",size);size();
const S={mode:"idle",zf:99,chosen:0,pos:0,ty:0,rot:0,shake:0,slow:1,broken:false,fake:false};
function resetScene(){Object.assign(S,{zf:99,chosen:0,ty:0,rot:0,shake:0,slow:1,broken:false,fake:false,vy:0,fallT:0})}
const K=1.15,L=4; // 分岐の曲がり
const bx=(z,s)=>{const d=z-S.zf;if(d<=0)return 0;return s*(d<L?K*d*d/(2*L):K*(d-L/2))};
const bs=(z,s)=>{const d=z-S.zf;if(d<=0)return 0;return s*(d<L?K*d/L:K)};
function cam(){if(!S.chosen)return[0,0];return[bx(0,S.chosen),bs(0,S.chosen)]}
let CX=0,CS=0,HY=0,F=0,VX=0;
const CH=1.2,CEIL=2.7;
const sx=(x,z)=>VX+(x-CX-z*CS)*F/z;
const sy=(h,z)=>HY+(CH-h)*F/z;
function light(z){return Math.max(0,Math.min(1,2.6/(z+1.2)))}
function quad(a,b,c,d,col){cx.fillStyle=col;cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.lineTo(c[0],c[1]);cx.lineTo(d[0],d[1]);cx.closePath();cx.fill()}
function corridors(z){
  // 返り値：[左壁x, 右壁x] の配列（世界座標）
  const zf=S.zf;
  if(z<=zf)return[[-1.7,1.7]];
  if(S.chosen&&zf<-1.5)return[[bx(z,S.chosen)-1.7,bx(z,S.chosen)+1.7]];
  const l=bx(z,-1),r=bx(z,1);
  if(z<zf+3.6)return[[l-1.7,r+1.7]];
  return[[l-1.7,l+0.95],[r-0.95,r+1.7]];
}
function rockCol(z,f,k){const l=light(z)*f;const r=Math.round(16+70*l*k),g=Math.round(10+40*l*k),b=Math.round(6+22*l*k);return`rgb(${r},${g},${b})`}
function draw(t,dt){
  const ctx=cx;
  HY=H*0.40;F=(H-HY)*0.92/CH;VX=W/2;
  [CX,CS]=cam();
  const fl=0.88+0.08*Math.sin(t*0.011)+0.05*Math.sin(t*0.037);
  ctx.save();
  if(S.shake>0){ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake)}
  ctx.fillStyle="#060302";ctx.fillRect(-20,-20,W+40,H+40);
  const ZMAX=34,Z0=0.45;
  const zs=[];for(let z=ZMAX;z>Z0;z-=z>8?1:0.5)zs.push(z);zs.push(Z0);
  for(let i=0;i<zs.length-1;i++){
    const z1=zs[i],z2=zs[i+1],c1=corridors(z1),c2=corridors(z2);
    if(c1.length!==c2.length){const o=c=>[[c[0][0],c[c.length-1][1]]];c1.splice(0,c1.length,...o(c1));c2.splice(0,c2.length,...o(c2))}
    for(let j=0;j<c1.length;j++){
      const[l1,r1]=c1[j],[l2,r2]=c2[j];
      quad([sx(l1,z1),sy(CEIL,z1)],[sx(r1,z1),sy(CEIL,z1)],[sx(r2,z2),sy(CEIL,z2)],[sx(l2,z2),sy(CEIL,z2)],rockCol(z2,fl,.55));
      quad([sx(l1,z1),sy(0,z1)],[sx(r1,z1),sy(0,z1)],[sx(r2,z2),sy(0,z2)],[sx(l2,z2),sy(0,z2)],rockCol(z2,fl,.75));
      quad([sx(l1,z1),sy(0,z1)],[sx(l2,z2),sy(0,z2)],[sx(l2,z2),sy(CEIL,z2)],[sx(l1,z1),sy(CEIL,z1)],rockCol(z2,fl,1));
      quad([sx(r1,z1),sy(0,z1)],[sx(r2,z2),sy(0,z2)],[sx(r2,z2),sy(CEIL,z2)],[sx(r1,z1),sy(CEIL,z1)],rockCol(z2,fl,.92));
    }
    // 中央の岩（分岐の間）
    const zp=S.zf+3.6;
    if(z1>=zp&&z2<zp&&!(S.chosen&&S.zf<-1.5)){
      const l=bx(zp,-1)+0.95,r=bx(zp,1)-0.95;
      quad([sx(l,zp),sy(0,zp)],[sx(r,zp),sy(0,zp)],[sx(r,zp),sy(CEIL,zp)],[sx(l,zp),sy(CEIL,zp)],rockCol(zp,fl,1.05));
      // 看板
      sign(ctx,zp,(bx(zp,-1)+bx(zp,1))/2,fl);
    }
    // たいまつ
    torches(ctx,z1,z2,fl);
  }
  // 線路
  const branches=[];
  if(S.chosen&&S.zf<-1.5)branches.push(S.chosen);else if(S.zf<ZMAX)branches.push(-1,1);
  drawTrack(ctx,0,null,ZMAX);
  for(const s of branches)drawTrack(ctx,s,s===S.chosen?S:null,ZMAX);
  ctx.restore();
  trolley(ctx,t);
  // 赤い光（転落）
  if(S.mode==="fall"){ctx.fillStyle=`rgba(255,60,10,${Math.min(.45,S.fallT*.6)})`;ctx.fillRect(0,0,W,H)}
  if(S.mode==="win")treasure(ctx,t);
}
function torches(ctx,z1,z2,fl){
  // 世界座標で5ごとに左右交互
  const off=S.pos%5;
  for(let k=1;k<8;k++){
    const z=k*5-off;
    if(!(z<=z1&&z>z2))continue;
    const side=(Math.floor((S.pos+z)/5)%2)?1:-1;
    const cs=corridors(z);const c=side<0?cs[0]:cs[cs.length-1];
    const x=side<0?c[0]+0.08:c[1]-0.08;
    const X=sx(x,z),Y=sy(1.75,z),r=1.4*F/z*fl;
    const g=ctx.createRadialGradient(X,Y,0,X,Y,r);
    g.addColorStop(0,"rgba(255,190,90,.55)");g.addColorStop(1,"rgba(255,120,30,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
    const s=0.12*F/z;
    ctx.fillStyle="#3a2210";ctx.fillRect(X-s*.25,Y,s*.5,s*2.2);
    ctx.fillStyle="#ffb43a";ctx.beginPath();ctx.ellipse(X,Y-s*.4,s*.5,s*(0.9+0.2*Math.sin(S.pos*9+z)),0,0,7);ctx.fill();
    ctx.fillStyle="#fff2b0";ctx.beginPath();ctx.ellipse(X,Y-s*.2,s*.22,s*.45,0,0,7);ctx.fill();
  }
}
function sign(ctx,z,cxw,fl){
  const X=sx(cxw,z),Y=sy(2.1,z),w=1.7*F/z,h=0.5*F/z;
  ctx.fillStyle="#2a160a";ctx.fillRect(X-w*.03,Y,w*.06,sy(0,z)-Y);
  ctx.fillStyle="#7a4720";ctx.fillRect(X-w/2,Y-h/2,w,h);
  ctx.strokeStyle="#3a1a05";ctx.lineWidth=Math.max(1,h*.08);ctx.strokeRect(X-w/2,Y-h/2,w,h);
  ctx.fillStyle="#ffe28a";ctx.font=`900 ${Math.max(8,h*.62)}px "Dela Gothic One",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("◀ 左　右 ▶",X,Y+h*.04);
}
function drawTrack(ctx,s,st,ZMAX){
  // s=0：分岐前（z<=zf）、s=±1：分岐後
  const zA=s===0?0.45:Math.max(0.45,S.zf),zB=s===0?Math.min(ZMAX,S.zf):ZMAX;
  if(zB<=zA)return;
  const cen=z=>s===0?0:bx(z,s);
  const brokenAt=st&&st.broken?S.zf+3.0:Infinity;
  const gapA=st&&st.fake?S.zf+5.6:Infinity,gapB=gapA+1.1;
  const inGap=z=>z>gapA&&z<gapB;
  const end=Math.min(zB,brokenAt);
  // 溶岩
  if(st&&st.broken){lava(ctx,brokenAt,brokenAt+4,cen)}
  if(st&&st.fake){lava(ctx,gapA,gapB,cen)}
  // まくらぎ
  const off=S.pos%1;
  for(let k=Math.ceil(end);k>=0;k--){
    const z=k+1-off;if(z<zA||z>end||inGap(z))continue;
    const c=cen(z),d=0.16;
    quad([sx(c-.62,z+d),sy(0,z+d)],[sx(c+.62,z+d),sy(0,z+d)],[sx(c+.62,z),sy(0,z)],[sx(c-.62,z),sy(0,z)],`rgb(${70*light(z)+20|0},${44*light(z)+12|0},${24*light(z)+6|0})`);
  }
  // レール
  ctx.strokeStyle="#c9b9a0";ctx.lineCap="round";
  for(const g of[-.38,.38]){
    let p=null;
    for(let z=end;z>=zA;z-=z>8?.5:.12){
      if(inGap(z)){p=null;continue}
      const X=sx(cen(z)+g,z),Y=sy(0.06,z);
      if(p){ctx.lineWidth=Math.min(9,Math.max(1,0.045*F/z));ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(X,Y);ctx.stroke()}
      p=[X,Y];
    }
  }
}
function lava(ctx,za,zb,cen){
  const c1=cen(za),c2=cen(zb);
  if(za<0.45)za=0.45;
  if(zb<=za)return;
  const g=ctx.createLinearGradient(0,sy(0,zb),0,sy(0,za));
  g.addColorStop(0,"#ffcf4a");g.addColorStop(1,"#ff3a0a");
  quad([sx(c2-1.6,zb),sy(0,zb)],[sx(c2+1.6,zb),sy(0,zb)],[sx(c1+1.6,za),sy(0,za)],[sx(c1-1.6,za),sy(0,za)],g);
  const X=sx(c1,za),Y=sy(0,za),r=2.4*F/za;
  const rg=ctx.createRadialGradient(X,Y,0,X,Y,r);rg.addColorStop(0,"rgba(255,90,20,.45)");rg.addColorStop(1,"rgba(255,60,10,0)");
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
}
function trolley(ctx,t){
  const tw=Math.min(W*.66,340),th=tw*.34;
  const bob=Math.sin(S.pos*Math.PI*2)*1.5;
  const X=W/2,Y=H-th*.55-12+S.ty+bob;
  ctx.save();ctx.translate(X,Y);ctx.rotate(S.rot);
  // 乗っている5人（後ろ姿）
  const cols=["#e05a3a","#3a8ae0","#ffd24a","#4ac07a","#c070e0"];
  for(let i=0;i<5;i++){
    const hx=(i-2)*tw*.17,hy=-th*.62+(i%2?-4:2),r=tw*.07;
    ctx.fillStyle=cols[i];ctx.beginPath();ctx.ellipse(hx,hy+r*1.3,r*1.15,r*.9,0,Math.PI,0);ctx.fill();
    ctx.fillStyle="#2a1a10";ctx.beginPath();ctx.arc(hx,hy,r,0,7);ctx.fill();
    ctx.fillStyle="#ffcd3c";ctx.beginPath();ctx.ellipse(hx,hy-r*.35,r*1.05,r*.75,0,Math.PI,0);ctx.fill();
    ctx.fillStyle="#fff6c0";ctx.beginPath();ctx.arc(hx,hy-r*.95,r*.22,0,7);ctx.fill();
  }
  // 車体
  const g=ctx.createLinearGradient(0,-th*.45,0,th*.45);g.addColorStop(0,"#9a6a3a");g.addColorStop(1,"#4a2a12");
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-tw/2,-th*.42);ctx.lineTo(tw/2,-th*.42);ctx.lineTo(tw*.42,th*.4);ctx.lineTo(-tw*.42,th*.4);ctx.closePath();ctx.fill();
  ctx.fillStyle="#2b2b30";ctx.fillRect(-tw/2-4,-th*.48,tw+8,th*.12);
  ctx.strokeStyle="rgba(0,0,0,.35)";ctx.lineWidth=2;
  for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*tw*.19,-th*.36);ctx.lineTo(i*tw*.16,th*.36);ctx.stroke()}
  ctx.fillStyle="#3a3a40";for(const k of[-.3,.3]){ctx.fillRect(k*tw-tw*.06,-th*.3,tw*.12,th*.6)}
  ctx.fillStyle="#ffcd3c";for(const k of[-.3,.3])for(const v of[-.2,.2]){ctx.beginPath();ctx.arc(k*tw,v*th,3,0,7);ctx.fill()}
  ctx.fillStyle="#111";for(const k of[-.33,.33]){ctx.beginPath();ctx.ellipse(k*tw,th*.42,tw*.08,th*.14,0,0,7);ctx.fill()}
  ctx.restore();
}
const coins=[];
function treasure(ctx,t){
  if(coins.length<120)for(let i=0;i<4;i++)coins.push({x:Math.random()*W,y:-20,v:2+Math.random()*4,r:5+Math.random()*6,a:Math.random()*6});
  for(const c of coins){c.y+=c.v;c.a+=.1;if(c.y>H+20){c.y=-20;c.x=Math.random()*W}
    ctx.fillStyle="#ffcd3c";ctx.beginPath();ctx.ellipse(c.x,c.y,c.r*Math.abs(Math.cos(c.a)),c.r,0,0,7);ctx.fill();
    ctx.fillStyle="#fff3b0";ctx.beginPath();ctx.ellipse(c.x-1,c.y-1,c.r*.35*Math.abs(Math.cos(c.a)),c.r*.35,0,0,7);ctx.fill()}
  const g=ctx.createRadialGradient(W/2,H*.4,0,W/2,H*.4,W*.8);g.addColorStop(0,"rgba(255,200,60,.25)");g.addColorStop(1,"rgba(255,200,60,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}


/* ============ 用語集 ============ */
const GL_COURSE=GLOSS.map(()=>[]);
COURSES.forEach((c,ci)=>c.q.forEach(q=>terms({q},99).forEach(i=>{if(!GL_COURSE[i].includes(ci))GL_COURSE[i].push(ci)})));
let glFilter="all";
function renderGlChips(){
  $("glchips").innerHTML=[`<button data-f="all" class="${glFilter==="all"?"on":""}">すべて</button>`].concat(COURSES.map((c,k)=>`<button data-f="${k}" class="${glFilter===String(k)?"on":""}">${k+1}. ${esc(c.t)}</button>`)).join("");
}
function renderGl(){
  const q=$("glq").value.trim();
  const hit=i=>!q||GLOSS[i][1].includes(q)||GLOSS[i][2].includes(q)||GLOSS[i][0].some(k=>k.replace("=","").includes(q));
  const card=(i)=>`<div class="gc"><b>${rb(GLOSS[i][1])}</b><p>${rb(GLOSS[i][2])}</p><span class="tag">出てくるコース：${GL_COURSE[i].map(k=>k+1).join("・")||"―"}</span></div>`;
  let html="",n=0;
  if(glFilter==="all"){
    const seen=new Set();
    COURSES.forEach((c,k)=>{
      const ids=GLOSS.map((_,i)=>i).filter(i=>GL_COURSE[i][0]===k&&hit(i));
      if(!ids.length)return;ids.forEach(i=>seen.add(i));n+=ids.length;
      html+=`<div class="glsec">${k+1}. ${esc(c.t)}（${esc(c.s)}）</div>`+ids.map(card).join("");
    });
    const rest=GLOSS.map((_,i)=>i).filter(i=>!GL_COURSE[i].length&&hit(i));
    if(rest.length){n+=rest.length;html+=`<div class="glsec">その他</div>`+rest.map(card).join("")}
  }else{
    const k=+glFilter,ids=GLOSS.map((_,i)=>i).filter(i=>GL_COURSE[i].includes(k)&&hit(i));n=ids.length;
    html=`<div class="glsec">${k+1}. ${esc(COURSES[k].t)}（${esc(COURSES[k].s)}）</div>`+ids.map(card).join("");
  }
  $("gllist").innerHTML=`<p class="glcount">${n}語</p>`+(n?html:`<p class="glcount">見つかりませんでした</p>`);
}
$("openGl").addEventListener("click",()=>{renderGlChips();renderGl();show("gloss");$("gllist").scrollTop=0});
$("closeGl").addEventListener("click",()=>show("title"));
$("glq").addEventListener("input",renderGl);
$("glchips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;glFilter=b.dataset.f;renderGlChips();renderGl();$("gllist").scrollTop=0});

/* ============ ループ ============ */
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  let speed=4;
  if(S.mode==="approach"&&G){
    const el=(t-G.t0)/1000,T=getT();
    if(T){const p=Math.min(1,el/T);S.zf=24-20*p;$("tbar").style.transform=`scaleX(${1-p})`;if(p>=1)choose(0)}
    else{S.zf=Math.max(7,24-17*el/6);$("tbar").style.transform="scaleX(1)"}
    speed=4;
  }
  if(S.mode==="pass"){
    speed=11*S.slow;
    S.zf-=speed*dt;
    S.rot+=((S.chosen*0.1)-S.rot)*Math.min(1,dt*6);
    if(S.broken&&S.zf+3.0<1.1){S.mode="fall";S.fallT=0;tone(3);flash(G.timeout?"時間切れ！":"ああっ！","#ff6a3a");onFell()}
    if(S.fake&&!S.fakeDone){
      const ga=S.zf+5.6;
      if(ga<1.3&&ga>-1.0){S.slow=.22;S.ty=Math.min(S.ty+dt*90,38);S.shake=6;if(!S._fx){S._fx=1;flash("……！？","#ffffff")}}
      else if(ga<=-1.0){S.fakeDone=true;S.slow=1;S._fx=0;S.shake=0}
    }else{S.ty+=(0-S.ty)*Math.min(1,dt*8)}
    if(!S.broken&&S.zf<(S.fake?-8:-6)){S.mode="run";S.zf=99;S.chosen=0;onPassed()}
  }else if(S.mode!=="fall"){S.rot+=(0-S.rot)*Math.min(1,dt*5);S.ty+=(0-S.ty)*Math.min(1,dt*8);S.shake=Math.max(0,S.shake-dt*20)}
  if(S.mode==="fall"){
    S.fallT+=dt;speed=Math.max(0,6-S.fallT*8);
    S.ty+=dt*(200+S.fallT*900);S.rot+=S.chosen*dt*1.4;S.shake=10;
  }
  if(S.mode==="win")speed=2;
  if(S.mode==="idle"||S.mode==="run")speed=S.mode==="idle"?3:4;
  S.pos+=speed*dt;
  if(S.fake&&S.fakeDone&&!S._safe){S._safe=1;flash("セーフ！","#ffd75a");tone(2)}
  if(S.mode!=="pass")S._safe=0;
  if(S.mode!=="win")coins.length=0;
  draw(t,dt);
  requestAnimationFrame(loop);
}
renderSet();renderList();
requestAnimationFrame(loop);
}
